<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빠른 연결</title>
<meta name="description" content="링크, 메모, 코드, 자료를 누구나 올리고 검색으로 바로 찾는 공유 자료함">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e2a94f'/%3E%3Cpath d='M9 9h14v14H9z' fill='none' stroke='%231a1408' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Nanum+Gothic+Coding&display=swap">
<script>
/* 첫 페인트 전에 시간대 스킨과 밝기를 정한다. 늦으면 색이 한 번 번쩍인다.
   저장값은 LS 헬퍼가 JSON 으로 넣으므로 따옴표를 벗기고 화이트리스트로 검증한다. */
(function(){
  try{
    var g=function(k){ return (localStorage.getItem(k)||'').replace(/^"|"$/g,'') };
    var v=g('toolbox.skin'), h=new Date().getHours();
    var auto = h<6?'night' : h<14?'dawn' : h<22?'day' : 'night';
    document.documentElement.dataset.skin = ['dawn','day','night'].indexOf(v)>=0 ? v : auto;
    var t=g('toolbox.theme');
    if(t==='light'||t==='dark') document.documentElement.dataset.theme=t;
  }catch(e){
    var h2=new Date().getHours();
    document.documentElement.dataset.skin = h2<6?'night' : h2<14?'dawn' : h2<22?'day' : 'night';
  }
})();
</script>
<style>
/* ==========================================================
   팔레트 — 두 축이 곱해진다
     축1 시간대(data-skin): 빛의 색상.  아침 / 낮·저녁 / 밤
     축2 밝게·어둡게: 그 빛이 종이에 반사되는지 화면에서 발광하는지
   시간대는 밝기를 모르고, 밝기는 시간대를 모른다.
   data-skin 이 없어도(스크립트 실패) 아래 폴백 한 벌이 걸린다.
   ========================================================== */
:root{
  --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Consolas,monospace;
  --bg:#EAE4E0; --bg2:#E3DBD5; --surface:#EEF8FF; --surface2:#DEF2FF; --line:#DACFC8; --line2:#C7BAB2;
  --text:#2A1E16; --muted:#554942; --faint:#675D56;
  --accent:#196480; --accent-ink:#F8FDFF; --accent-soft:#BBE6FA;
  --good:#43673F; --bad:#824B44; --bad-soft:#FDD5D0;
  --link:#415D87; --note:#704E76; --code:#266A58; --file:#7B522D;
  --shadow:0 6px 16px -6px #4F2F172E, 0 1px 2px -1px #4F2F1724;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
:root:not([data-skin]):not([data-theme="light"]){
  --bg:#111D24; --bg2:#19252D; --surface:#1F2C34; --surface2:#2A3942; --line:#34434D; --line2:#475863;
  --text:#E2EBF1; --muted:#B3BEC6; --faint:#98A3A9;
  --accent:#61CCF9; --accent-ink:#00161F; --accent-soft:#0A3F52;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #000205A6, 0 1px 2px -1px #0002058C;
  color-scheme:dark;
} }
:root[data-theme="dark"]:not([data-skin]){
  --bg:#111D24; --bg2:#19252D; --surface:#1F2C34; --surface2:#2A3942; --line:#34434D; --line2:#475863;
  --text:#E2EBF1; --muted:#B3BEC6; --faint:#98A3A9;
  --accent:#61CCF9; --accent-ink:#00161F; --accent-soft:#0A3F52;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #000205A6, 0 1px 2px -1px #0002058C;
  color-scheme:dark;
}

:root[data-skin="dawn"]{
  --bg:#EAE4E0; --bg2:#E3DBD5; --surface:#EEF8FF; --surface2:#DEF2FF; --line:#DACFC8; --line2:#C7BAB2;
  --text:#2A1E16; --muted:#554942; --faint:#675D56;
  --accent:#196480; --accent-ink:#F8FDFF; --accent-soft:#BBE6FA;
  --good:#43673F; --bad:#824B44; --bad-soft:#FDD5D0;
  --link:#415D87; --note:#704E76; --code:#266A58; --file:#7B522D;
  --shadow:0 6px 16px -6px #4F2F172E, 0 1px 2px -1px #4F2F1724;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
:root[data-skin="dawn"]:not([data-theme="light"]){
  --bg:#111D24; --bg2:#19252D; --surface:#1F2C34; --surface2:#2A3942; --line:#34434D; --line2:#475863;
  --text:#E2EBF1; --muted:#B3BEC6; --faint:#98A3A9;
  --accent:#61CCF9; --accent-ink:#00161F; --accent-soft:#0A3F52;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #000205A6, 0 1px 2px -1px #0002058C;
  color-scheme:dark;
} }
:root[data-theme="dark"][data-skin="dawn"]{
  --bg:#111D24; --bg2:#19252D; --surface:#1F2C34; --surface2:#2A3942; --line:#34434D; --line2:#475863;
  --text:#E2EBF1; --muted:#B3BEC6; --faint:#98A3A9;
  --accent:#61CCF9; --accent-ink:#00161F; --accent-soft:#0A3F52;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #000205A6, 0 1px 2px -1px #0002058C;
  color-scheme:dark;
}

:root[data-skin="day"]{
  --bg:#E1E5EE; --bg2:#D8DDE7; --surface:#FFF6E2; --surface2:#FDEDCD; --line:#CBD2E0; --line2:#B5BDCE;
  --text:#1A2130; --muted:#454C5B; --faint:#595F6D;
  --accent:#6434C2; --accent-ink:#FCFBFF; --accent-soft:#DED8FF;
  --good:#43673F; --bad:#824B44; --bad-soft:#FDD5D0;
  --link:#415D87; --note:#704E76; --code:#266A58; --file:#7B522D;
  --shadow:0 6px 16px -6px #2937572E, 0 1px 2px -1px #29375724;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
:root[data-skin="day"]:not([data-theme="light"]){
  --bg:#211A0B; --bg2:#2A2211; --surface:#312917; --surface2:#3F3522; --line:#4A402B; --line2:#5F543D;
  --text:#EFE9DD; --muted:#C3BCAC; --faint:#A7A092;
  --accent:#BFB2F9; --accent-ink:#140D29; --accent-soft:#3A3357;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #030100A6, 0 1px 2px -1px #0301008C;
  color-scheme:dark;
} }
:root[data-theme="dark"][data-skin="day"]{
  --bg:#211A0B; --bg2:#2A2211; --surface:#312917; --surface2:#3F3522; --line:#4A402B; --line2:#5F543D;
  --text:#EFE9DD; --muted:#C3BCAC; --faint:#A7A092;
  --accent:#BFB2F9; --accent-ink:#140D29; --accent-soft:#3A3357;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #030100A6, 0 1px 2px -1px #0301008C;
  color-scheme:dark;
}

:root[data-skin="night"]{
  --bg:#DAE8EC; --bg2:#CFE0E6; --surface:#FFF4F0; --surface2:#FFE9E2; --line:#BFD6DD; --line2:#A7C3CB;
  --text:#04262E; --muted:#365058; --faint:#4D646A;
  --accent:#9E1B66; --accent-ink:#FFFAFC; --accent-soft:#FBD1E2;
  --good:#43673F; --bad:#824B44; --bad-soft:#FDD5D0;
  --link:#415D87; --note:#704E76; --code:#266A58; --file:#7B522D;
  --shadow:0 6px 16px -6px #023F4C2E, 0 1px 2px -1px #023F4C24;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
:root[data-skin="night"]:not([data-theme="light"]){
  --bg:#2A140E; --bg2:#341C15; --surface:#3C221A; --surface2:#4B2E26; --line:#57382F; --line2:#6E4C41;
  --text:#F8E5DF; --muted:#CFB6AF; --faint:#B19B95;
  --accent:#F99DC6; --accent-ink:#240615; --accent-soft:#512B3D;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #060000A6, 0 1px 2px -1px #0600008C;
  color-scheme:dark;
} }
:root[data-theme="dark"][data-skin="night"]{
  --bg:#2A140E; --bg2:#341C15; --surface:#3C221A; --surface2:#4B2E26; --line:#57382F; --line2:#6E4C41;
  --text:#F8E5DF; --muted:#CFB6AF; --faint:#B19B95;
  --accent:#F99DC6; --accent-ink:#240615; --accent-soft:#512B3D;
  --good:#A3CB9E; --bad:#EAACA3; --bad-soft:#4F2924;
  --link:#A0C0EE; --note:#D5AEDB; --code:#8BCEB8; --file:#E1B38C;
  --shadow:0 6px 18px -8px #060000A6, 0 1px 2px -1px #0600008C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:var(--text)}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:15px}
.brand-name{font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand-sub{color:var(--muted);font-size:12px;display:none}
@media(min-width:760px){.brand-sub{display:block}}
.search{flex:1;position:relative}
.search input{width:100%;height:40px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);padding:0 44px 0 38px;font-size:14px}
.search input::placeholder{color:var(--faint)}
.search .ico{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .kbd{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.kbd span{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:var(--bg2)}
@media(max-width:600px){.search .kbd{display:none}.search input{padding-right:12px}.top-in{padding:10px 12px;gap:8px}.brand-name{display:none}}
/* iOS Safari 는 16px 미만 입력칸에 포커스가 가면 화면을 확대한다 */
@media(max-width:600px){.search input,.fld input,.fld textarea,.fld select{font-size:16px}}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.sso{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sso .btn{width:100%;justify-content:center;height:42px;font-weight:600;border-color:transparent}
.sso .btn:hover{filter:brightness(0.97)}
.btn.kakao{background:#FEE500;color:#191919}
.btn.google{background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line2)}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.badge{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;line-height:16px}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:230px 1fr;gap:28px}
@media(max-width:820px){.wrap{grid-template-columns:1fr;gap:14px;padding:12px 12px 60px}}
.rail{display:flex;flex-direction:column;gap:20px;align-self:start;position:sticky;top:78px;max-height:calc(100vh - 90px);overflow:auto}
@media(max-width:820px){.rail{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:14px}.rail section{min-width:0}}
.rail h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.rail h4 button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0 4px;letter-spacing:0}
.rail h4 button:hover{color:var(--text)}
.rail-list{display:flex;flex-direction:column;gap:1px}
@media(max-width:820px){.rail-list{flex-direction:row;flex-wrap:wrap;gap:6px}}
.f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;border:0;background:transparent;text-align:left;color:var(--muted);width:100%}
.f:hover{background:var(--surface);color:var(--text)}
.f.on{background:var(--accent-soft);color:var(--text)}
.f.sub{padding-left:24px;font-size:13px}
.f .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.f.on .cnt{color:var(--accent)}
.f .lbl{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:820px){.f{width:auto;padding:5px 10px;border:1px solid var(--line)}.f .cnt{display:none}.f.sub{padding-left:10px}}
.dot{width:8px;height:8px;border-radius:2px;flex:none;margin-right:8px}
.tags-cloud{display:flex;flex-wrap:wrap;gap:6px}
.tagbox summary,.sec summary{list-style:none;cursor:pointer;margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;user-select:none}
.tagbox summary::-webkit-details-marker,.sec summary::-webkit-details-marker{display:none}
.tagbox summary::before,.sec summary::before{content:"▸";font-size:10px;flex:none}
.tagbox[open] summary::before,.sec[open] summary::before{content:"▾"}
.sec summary:hover{color:var(--text)}
.sec summary .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec summary .num{font-family:var(--mono);color:var(--faint);letter-spacing:0;text-transform:none}
.sec summary .cur{color:var(--accent);letter-spacing:0;text-transform:none;font-weight:400}
.sec summary .acts{display:flex;gap:2px}
.sec summary .acts button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:2px 5px;letter-spacing:0;text-transform:none;border-radius:5px;min-height:24px}
.sec summary .acts button:hover{color:var(--text);background:var(--surface)}
.owner{font-size:10.5px;color:var(--faint);letter-spacing:0;text-transform:none;padding:2px 8px 4px 24px}
@media(max-width:820px){.owner{width:100%;padding:0 2px 2px}}
.owner b{color:var(--muted);font-weight:500}
.tagbox summary .num{font-family:var(--mono);color:var(--faint);letter-spacing:0}
.tagbox summary .cur{color:var(--accent);letter-spacing:0;text-transform:none;font-family:var(--mono)}
/* 모바일: 사이드바 항목을 본문과 같은 열에 펼치고, 태그만 본문 아래로 */
@media(max-width:820px){
  .rail{display:contents}
  .rail>*{order:0}
  .main{order:1;min-width:0}
  .tagbox{order:2;padding-top:6px;border-top:1px solid var(--line)}
  .tagbox summary{font-size:12px;padding:8px 0}
}
.tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer}
.tag:hover{border-color:var(--line2);color:var(--text)}
.tag.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.me{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12.5px}
@media(max-width:820px){.me{width:100%}}
.me .av{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.me .sp{margin-left:auto;display:flex;gap:2px}
.me .sp button{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:2px 5px}
.me .sp button:hover{color:var(--text)}
.adm{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 4px;letter-spacing:.06em}

/* ---------- main ---------- */
.main{min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.status{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status b{color:var(--text);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.pill.live i{background:var(--good)}
.pill.local i{background:var(--accent)}
.pill.err i{background:var(--bad)}
.sort{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.sort button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--muted);font-size:12.5px}
.sort button.on{background:var(--surface2);color:var(--text)}
.colhead{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.colhead h2{margin:0;font-size:17px;font-weight:600}
.colhead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.colhead .sp{margin-left:auto;display:flex;gap:6px}
.crumb{color:var(--muted);font-size:12px;margin-bottom:6px}
.notice{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--surface);padding:10px 14px;margin-bottom:12px;color:var(--muted);font-size:13px}
.notice code{font-family:var(--mono);background:var(--bg2);padding:1px 6px;border-radius:4px;color:var(--text)}

.list{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:0 12px;padding:11px 14px 11px 12px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
@media(max-width:600px){.row{grid-template-columns:40px 1fr auto;gap:0 8px;padding:10px 10px}}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.sel{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
.row.flag{box-shadow:inset 3px 0 0 var(--bad)}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:3px 0;text-align:center;border-radius:4px;border:1px solid currentColor;line-height:1.2;margin-top:2px}
.kind.link{color:var(--link)} .kind.note{color:var(--note)} .kind.snippet{color:var(--code)} .kind.file{color:var(--file)}
.row-main{min-width:0}
.row-title{font-weight:500;font-size:14.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-title .host{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400}
.row-sub{color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip{font-size:11px;color:var(--muted);background:var(--bg2);border-radius:4px;padding:1px 6px}
.chip.cat{color:var(--text);border:1px solid var(--line)}
.chip.warn{color:var(--bad);background:var(--bad-soft)}
.chip.col{color:var(--accent);background:var(--accent-soft)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.vote{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--bg2);border-radius:6px;padding:2px 8px;font-family:var(--mono);font-size:12px;color:var(--text)}
.vote:hover{border-color:var(--accent)}
.vote.done{border-color:var(--accent);color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px;box-shadow:0 1px 0 var(--accent)}
.detail{grid-column:1 / -1;margin-top:10px;padding:14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);cursor:default}
.detail .body{white-space:pre-wrap;word-break:break-word;max-width:72ch;line-height:1.65}
.detail pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;white-space:pre}
.detail .actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.detail .url{font-family:var(--mono);font-size:12px;word-break:break-all}
.detail .by{color:var(--faint);font-size:12px;margin-left:auto}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-weight:500;margin-bottom:6px;font-size:15px}
.empty code{font-family:var(--mono);background:var(--bg2);padding:1px 6px;border-radius:4px}

/* ---------- review ---------- */
.rv{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.rv-row{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px}
.rv-row:first-child{border-top:0}
.rv-row ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
.rv-row .acts{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(6,8,12,.55);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
@media(max-width:600px){.veil{padding:8px}}
.modal{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.modal.narrow{max-width:460px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:15px;font-weight:600}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types button{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.types button small{font-size:11px}
.types button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.types .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line2);background:var(--bg2);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--text)}
.fld textarea{min-height:110px;resize:vertical;line-height:1.5}
.fld textarea.code{font-family:var(--mono);font-size:12.5px;min-height:160px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--faint)}
.err{color:var(--bad);font-size:12.5px;margin-right:auto}
.ok{color:var(--good);font-size:13px}
.checks{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto}
.checks label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
.checks label:hover{background:var(--surface2)}
.checks .own{font-size:11px;color:var(--faint);margin-left:auto}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:7px;display:flex;justify-content:space-between;gap:10px;color:var(--text)}
.menu button:hover{background:var(--surface2)}
.menu button small{color:var(--muted)}

/* ---------- AI ---------- */
.modal.wide{max-width:900px}
.ai-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ai-sec h3{margin:0;font-size:14px;font-weight:600}
.ai-sec p{margin:0}
.ai-opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.ai-opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.ai-opts b{font-family:var(--mono);font-weight:500;color:var(--muted)}
.ai-wrap{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ai-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ai-tbl th,.ai-tbl td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.ai-tbl th{color:var(--muted);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--surface);border-top:0}
.ai-old{color:var(--faint)}
.ai-new{color:var(--good)}
.ai-tag{font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;white-space:nowrap}
.ai-notes{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;line-height:1.6}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 30px;color:var(--faint);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}

/* ==========================================================
   판과 광원 — 검색창이 광원이고, 목록은 그 빛을 받는 판이다
   ========================================================== */

/* 광원이 옮겨 가는 순간 (8시간마다 한 번) */
html{transition:background-color .9s ease}
body,.top,.list,.row,.rv,.modal,.colhead,.notice,.me,.sort,.search input,.detail{
  transition:background-color .9s ease,border-color .9s ease,color .9s ease}
.row{transition:background-color .9s ease,box-shadow .12s ease,transform .12s ease}
@media(prefers-reduced-motion:reduce){
  html,body,.top,.list,.row,.rv,.modal,.colhead,.notice,.me,.sort,.search input,.detail{transition:none}}

/* 서명 1 — 검색창이 이 페이지의 광원 */
.search{isolation:isolate}
.search .ico{display:none}
.search::before{content:"\203A";position:absolute;left:14px;top:50%;
  transform:translateY(-52%);font:500 20px/1 var(--mono);color:var(--accent);
  pointer-events:none;z-index:1}
.search input{height:44px;border-radius:12px;padding-left:34px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow), 0 0 26px -8px var(--accent-soft);
  transition:box-shadow .12s ease,border-color .12s ease}
.search:focus-within input{border-color:var(--accent);
  box-shadow:var(--shadow),0 0 34px -6px var(--accent-soft),0 0 0 3px var(--accent-soft)}
.search:focus-within .kbd{opacity:0;transition:opacity .12s ease}
.search::after{content:"";position:absolute;inset:-16px -10px -20px;z-index:-1;
  border-radius:22px;pointer-events:none;opacity:.6;
  background:radial-gradient(58% 130% at 50% 10%, var(--accent-soft), transparent 72%)}
/* 그 빛이 닿는 곳 = 검색어가 맞은 자리 */
mark{background:transparent;color:inherit;border-radius:0;padding:0;
  box-shadow:inset 0 -.42em 0 var(--accent-soft)}

/* 서명 2 — 목록은 표가 아니라 판 위에 붙인 조각 */
.list{background:transparent;border:0;border-radius:0;overflow:visible;
  display:flex;flex-direction:column;gap:5px}
.row{background:var(--surface);border-top:0;border-radius:3px 11px 11px 3px;
  padding:12px 14px 12px 13px;
  box-shadow:inset 4px 0 0 var(--tape,var(--line2)), var(--shadow)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.sel{background:var(--surface2);transform:translateY(-1px);
  box-shadow:inset 7px 0 0 var(--tape,var(--accent)),0 0 0 1px var(--accent),var(--shadow)}
.row.flag{box-shadow:inset 7px 0 0 var(--bad),0 0 0 1px var(--bad),var(--shadow)}
/* 붙임날 색 = 종류색. :has() 를 모르는 브라우저는 기본 회색으로 조용히 물러난다 */
.row:has(>.kind.link){--tape:var(--link)}
.row:has(>.kind.note){--tape:var(--note)}
.row:has(>.kind.snippet){--tape:var(--code)}
.row:has(>.kind.file){--tape:var(--file)}
.list .empty{background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.detail{background:var(--bg);border-color:var(--line);border-radius:9px}

/* 모양 — 딱딱함만 걷어내고 정보 밀도는 그대로 */
.brand-mark{border-radius:9px;box-shadow:0 0 22px -6px var(--accent)}
.brand-name{font-weight:700;letter-spacing:-.035em}
.btn,.sort,.fld input,.fld textarea,.fld select,.types button{border-radius:10px}
.rv,.colhead,.notice{border-radius:14px}
.colhead,.rv{box-shadow:var(--shadow)}
.modal{border-radius:16px;box-shadow:var(--shadow),0 24px 60px -20px rgba(0,0,0,.28)}
.kind{border-radius:5px}
.chip,.tag{border-radius:6px}
.f.on{box-shadow:inset 2px 0 0 var(--accent)}

/* 한글 조판 */
html,body{line-height:1.66;word-break:keep-all;overflow-wrap:anywhere}
.row-title,.colhead h2,.colhead p,.detail .body,.empty,.notice{word-break:keep-all}
.detail pre,.detail .url,.vote,.kind{word-break:normal}
.tagbox summary,.sec summary{text-transform:none;font-size:11px;
  letter-spacing:.30em;font-weight:500}
.colhead h2{font-size:17px;font-weight:700;letter-spacing:-.025em}
.modal-h h2{font-weight:700;letter-spacing:-.02em}
.row-title{font-weight:500;letter-spacing:-.012em;line-height:1.45}
.row-sub{line-height:1.5}
.tag{font-family:var(--sans);letter-spacing:0}   /* 한글 태그가 몰래 시스템 글꼴로 떨어지던 자리 */
.mono,.num,.kbd span,.detail pre,.detail .url,.vote,.kind,.f .cnt{
  font-variant-numeric:tabular-nums}

/* 키캡 — 누르는 물건으로 보이게 */
.kbd span,.foot .mono{border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;background:var(--bg2);color:var(--muted);
  font-family:var(--mono);font-size:11px}
.foot{gap:10px 18px}

/* 기존 대비 결함 두 곳 */
.badge{color:var(--bg)}
.pill i{background:var(--muted)}

/* 화면 고르기 패널 */
.skinbtn{position:relative}
.skinpop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:200px;
  background:var(--surface);border:1px solid var(--line2);border-radius:12px;
  box-shadow:var(--shadow),0 20px 50px -20px rgba(0,0,0,.3);padding:6px;
  display:flex;flex-direction:column;gap:1px}
.skinpop h5{margin:6px 8px 2px;font-size:10.5px;font-weight:500;letter-spacing:.16em;color:var(--faint)}
.skinpop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:0;background:transparent;color:var(--text);padding:7px 9px;border-radius:8px;font-size:13px}
.skinpop button:hover{background:var(--surface2)}
.skinpop button .mk{width:14px;color:var(--accent);flex:none}
.skinpop button small{margin-left:auto;color:var(--faint);font-size:11px;font-family:var(--mono)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ================================================================
   저장 계층 (Storage adapter)
   ---------------------------------------------------------------
   페이지 나머지는 store 객체만 사용한다.
     subscribe(cb)            cb({items, cats, cols, reports})
     put(item) / patch(id,p) / remove(id)
     putCol(col) / removeCol(id)
     addReport(r) / removeReports(ids)
     vote(id) → 'added' | 'dup'
     saveCategories(list)     list = [{name, subs:[...]}]   (운영자만)
     ai(action, payload)      Edge Function 'ai' 호출. suggest / organize / taxonomy
     auth: onAuth(cb), login(email), logout(), setName(name)
   SupabaseStore: 실제 서비스.  LocalStore: 설정이 비어 있을 때 미리보기.
   ================================================================ */
const CFG=window.TOOLBOX_CONFIG||{};
let DB_ERR='';        // 자료 조회 실패 메시지 (빈 목록과 구분해서 보여 준다)
const AI_ON=CFG.AI!==false;   // AI 버튼 표시 여부. 실제 동작은 Edge Function 배포 후 (미리보기 모드에서는 숨김)
const DEFAULT_CATS=[{name:'개발·도구',subs:[]},{name:'생활·건강·취미',subs:[]},{name:'AI 에이전트',subs:[]},{name:'유머',subs:[]}];
// 분야 하나: {name, subs, owner?, ownerName?}
//   owner     주 관리자의 사용자 id. 없으면 운영자가 담당
//   ownerName 그때의 닉네임 스냅샷. 로그인 안 한 사람도 담당자를 볼 수 있게 함께 저장한다
const normCats=list=>(Array.isArray(list)?list:[]).map(c=>{
  if(typeof c==='string') return {name:c,subs:[]};
  const o={name:String(c.name||''),subs:Array.isArray(c.subs)?c.subs.map(String):[]};
  if(c.owner) o.owner=String(c.owner);
  if(c.ownerName) o.ownerName=String(c.ownerName).slice(0,24);
  return o;
}).filter(c=>c.name);
const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v) }catch(e){ return d } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }};

function LocalStore(){
  const K={items:'toolbox.items',cats:'toolbox.cats',cols:'toolbox.cols',reports:'toolbox.reports',votes:'toolbox.votes'};
  const D={items:LS.get(K.items,null),cats:normCats(LS.get(K.cats,DEFAULT_CATS)),cols:LS.get(K.cols,[]),reports:LS.get(K.reports,[]),votes:LS.get(K.votes,[])};
  if(!D.items){ D.items=EXAMPLES.map(x=>({...x,example:true})); LS.set(K.items,D.items); }
  if(!D.cats.length) D.cats=normCats(DEFAULT_CATS);
  const me={id:LS.get('toolbox.uid',null)||(()=>{ const v='u'+Math.random().toString(36).slice(2,10); LS.set('toolbox.uid',v); return v })(),name:LS.get('toolbox.name',''),email:'',admin:true};
  const subs=[]; let authCb=null;
  const emit=()=>subs.forEach(cb=>cb({items:D.items.slice(),cats:D.cats.slice(),cols:D.cols.slice(),reports:D.reports.slice(),myVotes:D.votes.slice()}));
  const up=(arr,it)=>{ const i=arr.findIndex(x=>x.id===it.id); if(i>=0)arr[i]=it; else arr.push(it); };
  return {
    kind:'local',
    subscribe(cb){ subs.push(cb); emit(); },
    onAuth(cb){ authCb=cb; cb(me); },
    async login(){ return {ok:true} }, async verifyCode(){ return {ok:true} }, async loginWith(){ return {ok:true} }, async logout(){},
    async setName(n){ me.name=n; LS.set('toolbox.name',n); authCb&&authCb(me); },
    async renamePast(n){ let c=0; D.items.forEach(i=>{ if(i.ownerId===me.id&&i.by!==n){ i.by=n; c++ } }); D.cols.forEach(x=>{ if(x.ownerId===me.id) x.by=n }); LS.set(K.items,D.items); LS.set(K.cols,D.cols); emit(); return c },
    async put(it){ up(D.items,it); LS.set(K.items,D.items); emit() },
    async patch(id,p){ const i=D.items.findIndex(x=>x.id===id); if(i>=0){ D.items[i]={...D.items[i],...p}; LS.set(K.items,D.items); emit() } },
    async remove(id){ D.items=D.items.filter(x=>x.id!==id); LS.set(K.items,D.items); emit() },
    async putCol(c){ up(D.cols,c); LS.set(K.cols,D.cols); emit() },
    async removeCol(id){ D.cols=D.cols.filter(x=>x.id!==id); LS.set(K.cols,D.cols); emit() },
    async addReport(r){ D.reports.push(r); LS.set(K.reports,D.reports); emit() },
    async removeReports(ids){ D.reports=D.reports.filter(x=>!ids.includes(x.id)); LS.set(K.reports,D.reports); emit() },
    async vote(id){ if(D.votes.includes(id)) return 'dup'; D.votes.push(id); LS.set(K.votes,D.votes); const i=D.items.findIndex(x=>x.id===id); if(i>=0) D.items[i].votes=(D.items[i].votes||0)+1; LS.set(K.items,D.items); emit(); return 'added' },
    async saveCategories(list){ D.cats=normCats(list); LS.set(K.cats,D.cats); emit() },
    async people(){ return me.name?[{id:me.id,name:me.name}]:[] },
    async ai(){ throw new Error('미리보기 모드에서는 AI 기능을 쓸 수 없습니다. config.js 에 Supabase 를 연결해 주세요.') },
  };
}

function SupabaseStore(){
  const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const D={items:[],cats:normCats(DEFAULT_CATS),cols:[],reports:[],myVotes:[]};
  const me={id:null,name:'',email:'',admin:false};
  const subs=[]; let authCb=null;
  const emit=()=>subs.forEach(cb=>cb({...D,items:D.items.slice(),cols:D.cols.slice(),reports:D.reports.slice(),myVotes:D.myVotes.slice()}));
  // row ↔ item 변환
  const fromItem=r=>({id:r.id,type:r.type,title:r.title,url:r.url||'',lang:r.lang||'',body:r.body||'',category:r.category||'',sub:r.sub||'',tags:r.tags||[],votes:r.votes||0,by:r.by||'',ownerId:r.owner_id||null,createdAt:r.created_at,updatedAt:r.updated_at||null});
  const toItem=i=>({id:i.id,type:i.type,title:i.title,url:i.url||'',lang:i.lang||'',body:i.body||'',category:i.category||'',sub:i.sub||'',tags:i.tags||[],by:i.by||'',owner_id:i.ownerId||me.id,created_at:i.createdAt||new Date().toISOString(),updated_at:i.updatedAt||null});
  const fromCol=r=>({id:r.id,title:r.title,desc:r.desc||'',itemIds:r.item_ids||[],by:r.by||'',ownerId:r.owner_id||null,createdAt:r.created_at,updatedAt:r.updated_at||null});
  const toCol=c=>({id:c.id,title:c.title,desc:c.desc||'',item_ids:c.itemIds||[],by:c.by||'',owner_id:c.ownerId||me.id,created_at:c.createdAt||new Date().toISOString(),updated_at:c.updatedAt||null});
  const fromRep=r=>({id:r.id,itemId:r.item_id,reason:r.reason,note:r.note||'',by:r.by||'',reporterId:r.reporter_id,createdAt:r.created_at});
  const fail=(e,what)=>{ const err=new Error(e.message||what); err.code=e.code||'error'; throw err; };
  // 읽기
  async function load(t){
    if(t==='items'){ const {data,error}=await sb.from('items').select('*').order('created_at',{ascending:false}).limit(5000);
      // 조회 실패를 조용히 넘기면 '아직 항목이 없습니다' 로 잘못 보인다
      if(error){ DB_ERR=error.message||'자료를 불러오지 못했습니다'; setConn('err'); } else { DB_ERR=''; D.items=(data||[]).map(fromItem); } }
    if(t==='collections'){ const {data,error}=await sb.from('collections').select('*'); if(!error) D.cols=(data||[]).map(fromCol); }
    if(t==='reports'){ if(!me.id){ D.reports=[]; } else { const {data,error}=await sb.from('reports').select('*'); if(!error) D.reports=(data||[]).map(fromRep); } }
    if(t==='settings'){ const {data}=await sb.from('settings').select('value').eq('key','categories').maybeSingle(); const n=normCats(data&&data.value&&data.value.list); if(n.length) D.cats=n; }
    if(t==='votes'){ if(!me.id){ D.myVotes=[]; } else { const {data}=await sb.from('votes').select('item_id'); D.myVotes=(data||[]).map(r=>r.item_id); } }
    emit();
  }
  async function loadAll(){ await Promise.all(['items','collections','settings','reports','votes'].map(load)); }
  // 실시간: 바뀐 테이블만 다시 읽기 (지연 합치기)
  const timers={}; const bump=t=>{ clearTimeout(timers[t]); timers[t]=setTimeout(()=>load(t),250); };
  sb.channel('toolbox')
    .on('postgres_changes',{event:'*',schema:'public',table:'items'},()=>bump('items'))
    .on('postgres_changes',{event:'*',schema:'public',table:'collections'},()=>bump('collections'))
    .on('postgres_changes',{event:'*',schema:'public',table:'reports'},()=>bump('reports'))
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>bump('settings'))
    .subscribe(status=>{ if(status==='SUBSCRIBED') setConn('db'); else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') setConn('err'); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') loadAll(); });
  // 인증
  async function applySession(session){
    const u=session&&session.user;
    if(!u){ Object.assign(me,{id:null,name:'',email:'',admin:false,suggestedName:''}); }
    else{
      me.id=u.id; me.email=u.email||''; me.provider=(u.app_metadata&&u.app_metadata.provider)||'email';
      const {data}=await sb.from('profiles').select('name,is_admin').eq('id',u.id).maybeSingle();
      me.name=(data&&data.name)||''; me.admin=!!(data&&data.is_admin);
      // 소셜 로그인 첫 진입: 카카오·구글 닉네임은 "제안"만 한다. 저장하지 않는다.
      // 카카오 프로필 이름은 본명인 경우가 많고, 자료를 올리면 누구에게나 공개되기 때문이다.
      // 이름 창(openNameForm)이 이 값을 미리 채워 보여 주고, 사용자가 확인·수정한 뒤에 저장된다.
      if(!me.name){ const md=u.user_metadata||{};
        me.suggestedName=(md.name||md.full_name||md.preferred_username||md.user_name||'').trim().slice(0,24); }
    }
    authCb&&authCb(me);
    await Promise.all([load('reports'),load('votes')]);
  }
  sb.auth.onAuthStateChange((_ev,session)=>{ applySession(session); });
  return {
    kind:'db',
    subscribe(cb){ subs.push(cb); emit(); loadAll(); },
    onAuth(cb){ authCb=cb; cb(me); },
    async login(email){
      const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error) fail(error,'로그인 메일을 보내지 못했습니다'); return {ok:true};
    },
    async verifyCode(email,code){
      const {error}=await sb.auth.verifyOtp({email,token:code,type:'email'});
      if(error) fail(error,'코드가 맞지 않습니다'); return {ok:true};
    },
    async loginWith(provider){
      const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}});
      if(error) fail(error,'로그인을 시작하지 못했습니다'); return {ok:true};
    },
    async logout(){ await sb.auth.signOut(); },
    async setName(n){ const {error}=await sb.from('profiles').update({name:n}).eq('id',me.id); if(error) fail(error); me.name=n; authCb&&authCb(me); },
    // 예전에 올린 자료·모음의 표시 이름도 함께 바꾼다.
    // by 는 항목마다 복사되어 저장되므로, 이걸 하지 않으면 이름을 바꿔도 예전 글에는 옛 이름이 남는다.
    async renamePast(n){
      if(!me.id) return 0;
      const {data,error}=await sb.from('items').update({by:n}).eq('owner_id',me.id).neq('by',n).select('id');
      if(error) fail(error);
      await sb.from('collections').update({by:n}).eq('owner_id',me.id).neq('by',n);
      bump('items'); bump('collections');
      return (data||[]).length;
    },
    // 신규는 insert, 수정은 update. upsert 를 쓰면 Postgres 가 INSERT 정책(owner_id=auth.uid())까지 새 행에 적용해
    // 운영자가 남의 항목을 고칠 때 항상 42501 이 난다. 수정 시 owner_id·created_at 은 보내지 않아 소유권도 지킨다.
    async put(it){
      const row=toItem(it);
      const upd=()=>{ const {owner_id,created_at,...rest}=row; return sb.from('items').update(rest).eq('id',it.id) };
      if(D.items.some(x=>x.id===it.id)){ const {error}=await upd(); if(error) fail(error); }
      else{
        const {error}=await sb.from('items').insert(row);
        if(error){ if(error.code!=='23505') fail(error); const {error:e2}=await upd(); if(e2) fail(e2); }   // 이미 있던 행이면 수정으로
      }
      bump('items');
    },
    async patch(id,p){ const row={}; ['title','category','sub','tags','body'].forEach(k=>{ if(k in p) row[k]=p[k]; }); if('updatedAt' in p) row.updated_at=p.updatedAt; const {error}=await sb.from('items').update(row).eq('id',id); if(error) fail(error); bump('items'); },
    async remove(id){ const {error}=await sb.from('items').delete().eq('id',id); if(error) fail(error); bump('items'); },
    async putCol(c){
      const row=toCol(c);
      const upd=()=>{ const {owner_id,created_at,...rest}=row; return sb.from('collections').update(rest).eq('id',c.id) };
      if(D.cols.some(x=>x.id===c.id)){ const {error}=await upd(); if(error) fail(error); }
      else{
        const {error}=await sb.from('collections').insert(row);
        if(error){ if(error.code!=='23505') fail(error); const {error:e2}=await upd(); if(e2) fail(e2); }
      }
      bump('collections');
    },
    async removeCol(id){ const {error}=await sb.from('collections').delete().eq('id',id); if(error) fail(error); bump('collections'); },
    async addReport(r){ const {error}=await sb.from('reports').insert({id:r.id,item_id:r.itemId,reason:r.reason,note:r.note||'',by:r.by||'',reporter_id:me.id}); if(error) fail(error); bump('reports'); },
    async removeReports(ids){ if(!ids.length) return; const {error}=await sb.from('reports').delete().in('id',ids); if(error) fail(error); bump('reports'); },
    async vote(id){ const {error}=await sb.from('votes').insert({item_id:id,user_id:me.id}); if(error){ if(error.code==='23505') return 'dup'; fail(error); } D.myVotes.push(id); bump('items'); return 'added'; },
    async saveCategories(list){ const {error}=await sb.from('settings').upsert({key:'categories',value:{list:normCats(list)},updated_at:new Date().toISOString()}); if(error) fail(error); bump('settings'); },
    // 주 관리자로 지정할 사람 목록. 운영자만 부를 수 있다 (profiles 정책이 운영자에게만 전체 조회를 허용).
    // 닉네임만 돌려준다. 이메일 등 계정 정보는 화면에 올리지 않는다.
    async people(){
      const {data,error}=await sb.from('profiles').select('id,name').order('created_at');
      if(error) fail(error);
      return (data||[]).map(r=>({id:r.id,name:(r.name||'').trim()})).filter(p=>p.name);
    },
    // AI: Edge Function 'ai' 에 요청. 로그인 토큰은 supabase-js 가 자동으로 붙인다
    async ai(action,payload){
      const {data,error}=await sb.functions.invoke('ai',{body:{action,...(payload||{})}});
      if(error){
        let msg=error.message||'AI 호출에 실패했습니다'; const ctx=error.context;
        if(ctx&&ctx.status===404) msg='AI 기능이 아직 배포되지 않았습니다 (README 7단계)';
        else if(ctx&&typeof ctx.json==='function'){ try{ const j=await ctx.json(); if(j&&j.error) msg=j.error; }catch(e){} }
        else if(/Failed to send|fetch/i.test(msg)) msg='AI 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요';
        const err=new Error(msg); err.code=(ctx&&ctx.status)||'ai'; throw err;
      }
      if(data&&data.error){ const err=new Error(data.error); err.code='ai'; throw err; }
      return data||{};
    },
  };
}

/* ---------- 검색 ---------- */
function parseQ(q){
  const out={words:[],type:null,cat:null,tags:[]};
  q.toLowerCase().split(/\s+/).filter(Boolean).forEach(t=>{
    if(t.startsWith('type:')) out.type=t.slice(5);
    else if(t.startsWith('cat:')) out.cat=t.slice(4);
    else if(t.startsWith('#')&&t.length>1) out.tags.push(t.slice(1));
    else out.words.push(t);
  });
  return out;
}
const hay=it=>[it.title,it.url,it.body,it.lang,it.category,it.sub,(it.tags||[]).join(' '),it.by].join(' ').toLowerCase();
const curCol=()=>S.col?S.cols.find(c=>c.id===S.col):null;
function filtered(){
  const p=parseQ(S.q); const col=curCol();
  let list=S.items.filter(it=>{
    if(col&&!(col.itemIds||[]).includes(it.id)) return false;
    if(S.mine&&it.ownerId!==ME.id) return false;
    if(S.type!=='all'&&it.type!==S.type) return false;
    if(S.cat!=='all'&&it.category!==S.cat) return false;
    if(S.sub&&it.sub!==S.sub) return false;
    if(S.tag&&!(it.tags||[]).includes(S.tag)) return false;
    if(p.type&&!it.type.startsWith(p.type)) return false;
    if(p.cat&&!((it.category||'')+' '+(it.sub||'')).toLowerCase().includes(p.cat)) return false;
    if(p.tags.length&&!p.tags.every(t=>(it.tags||[]).some(x=>x.toLowerCase().includes(t)))) return false;
    if(p.words.length){ const h=hay(it); if(!p.words.every(w=>h.includes(w))) return false; }
    return true;
  });
  if(S.sort==='recent') list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  else if(S.sort==='votes') list.sort((a,b)=>(b.votes||0)-(a.votes||0)||(b.createdAt||'').localeCompare(a.createdAt||''));
  else list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ko'));
  return list;
}
function hl(text){
  const words=parseQ(S.q).words; let s=esc(text);
  words.forEach(w=>{ const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); s=s.replace(re,'<mark>$1</mark>'); });
  return s;
}
const reportsFor=id=>S.reports.filter(r=>r.itemId===id);
const colsOf=id=>S.cols.filter(c=>(c.itemIds||[]).includes(id));

function render(){
  renderMe(); renderRail(); renderReviewBtn();
  const inReview=S.view==='review';
  $('#list').hidden=inReview; $('#review').hidden=!inReview; $('#colHead').hidden=inReview; document.querySelector('.bar').hidden=inReview;
  if(inReview){ renderReview(); return; }
  const list=filtered(); renderColHead();
  $('#count').innerHTML=`<b>${list.length}</b>개 · 전체 ${S.items.length}개`;
  const el=$('#list');
  if(!list.length){
    if(DB_ERR){ el.innerHTML=`<div class="empty"><b>자료를 불러오지 못했습니다</b>${esc(DB_ERR)}<br>새로고침해 보시고, 계속되면 운영자에게 알려 주세요.</div>`; return; }
    const anyFilter=S.q||S.type!=='all'||S.cat!=='all'||S.tag||S.col||S.mine;
    el.innerHTML=`<div class="empty"><b>${anyFilter?'검색 결과가 없습니다':'아직 항목이 없습니다'}</b>${anyFilter?'다른 단어로 찾거나 필터를 지워 보세요. <code>type:</code> <code>cat:</code> <code>#태그</code> 문법을 쓸 수 있습니다.':'오른쪽 위 <code>＋ 추가</code> 로 첫 자료를 올려 보세요.'}</div>`;
    return;
  }

  el.innerHTML=list.map((it,i)=>row(it,i)).join('');
}
function row(it,i){
  const t=TYPES[it.type]||TYPES.note, open=S.sel===it.id;
  const sub=it.type==='link'||it.type==='file'?(it.body||it.url||''):(it.body||'').split('\n')[0];
  const rp=isMod()?reportsFor(it.id).length:0;   // 볼 수 있는 신고만 S.reports 에 들어온다
  const cls='row'+(open||S.cursor===i?' sel':'')+(rp?' flag':'');
  const cs=colsOf(it.id); const voted=S.myVotes.includes(it.id);
  return `<div class="${cls}" data-id="${esc(it.id)}" data-i="${i}">
    <span class="kind ${it.type}">${t.k}</span>
    <div class="row-main">
      <div class="row-title">${hl(it.title||'(제목 없음)')}${it.url?`<span class="host">${esc(host(it.url))}</span>`:''}${it.lang?`<span class="host">${esc(it.lang)}</span>`:''}</div>
      ${sub?`<div class="row-sub">${hl(sub)}</div>`:''}
      <div class="row-meta">${it.category?`<span class="chip cat">${esc(it.category)}${it.sub?' › '+esc(it.sub):''}</span>`:''}${(it.tags||[]).map(x=>`<span class="chip">#${esc(x)}</span>`).join('')}${cs.slice(0,2).map(c=>`<span class="chip col">▤ ${esc(c.title)}</span>`).join('')}${it.example?'<span class="chip">예시</span>':''}${rp?`<span class="chip warn">신고 ${rp}</span>`:''}</div>
    </div>
    <div class="row-side">
      <button class="vote${voted?' done':''}" data-vote="${esc(it.id)}" title="추천">▲ <span class="num">${it.votes||0}</span></button>
      <span>${rel(it.createdAt)}</span>
    </div>
    ${open?detail(it):''}
  </div>`;
}
function detail(it){
  let body='';
  if(it.type==='snippet') body=`<pre>${esc(it.body||'')}</pre>`;
  else if(it.body) body=`<div class="body">${esc(it.body)}</div>`;
  const su=safeUrl(it.url);
  const url=it.url?`<div class="url" style="margin-top:${body?10:0}px">${su?`<a href="${esc(su)}" target="_blank" rel="noopener">${esc(it.url)}</a>`:`${esc(it.url)} <span class="chip warn">열 수 없는 주소</span>`}</div>`:'';
  const own=canEdit(it); const rep=myReported().has(it.id);
  return `<div class="detail" data-stop>
    ${body}${url}
    <div class="actions">
      ${su?`<a class="btn small" href="${esc(su)}" target="_blank" rel="noopener">열기 ↗</a>`:''}
      ${it.type==='snippet'?`<button class="btn small" data-copy="${esc(it.id)}">코드 복사</button>`:''}
      ${it.url?`<button class="btn small" data-copyurl="${esc(it.id)}">주소 복사</button>`:''}

      ${own?`<button class="btn small" data-edit="${esc(it.id)}">수정</button><button class="btn small ghost danger" data-del="${esc(it.id)}">삭제</button>`:`<button class="btn small ghost${rep?'':' danger'}" data-report="${esc(it.id)}" ${rep?'disabled':''}>${rep?'신고됨':'신고'}</button>`}
      <span class="by">${it.by?esc(it.by)+' · ':''}${new Date(it.createdAt).toLocaleString('ko-KR')}${it.updatedAt?' · 수정됨':''}${it.ownerId&&it.ownerId===ME.id?' · 내 글':''}</span>

}

  const cols=S.cols.slice().sort((a,b)=>(b.itemIds||[]).length-(a.itemIds||[]).length);
  $('#colNum').textContent=cols.length?cols.length:'';
  $('#colList').innerHTML=cols.length?cols.map(c=>`<button class="f${S.col===c.id?' on':''}" data-col="${esc(c.id)}"><span class="lbl">▤&nbsp;${esc(c.title)}</span><span class="cnt">${(c.itemIds||[]).length}</span></button>`).join(''):'<span class="hint">모음은 주제별로 항목을 묶는 큐레이션입니다. 첫 모음을 만들어 보세요.</span>';
  const tc={}; S.items.forEach(it=>(it.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  const tags=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,40);

  $('#tagSum').innerHTML=`태그 <span class="num">${Object.keys(tc).length}</span>${S.tag?` <span class="cur">#${esc(S.tag)}</span>`:''}`;

document.querySelector('.rail').addEventListener('click',e=>{
  const t=e.target.closest('[data-type]'),c=e.target.closest('[data-cat]'),s=e.target.closest('[data-sub]'),g=e.target.closest('[data-tag]'),m=e.target.closest('[data-mine]'),k=e.target.closest('[data-col]');
  if(t) S.type=t.dataset.type;
  if(c){
    const n=c.dataset.cat;
    if(n==='all'){ S.cat='all'; S.sub=null; S.openCats=[]; }
    else{
      const wasOpen=S.openCats.includes(n);
      // 다시 누르면 접고 필터도 푼다. 다른 분야의 펼침은 건드리지 않는다.
      S.openCats=wasOpen?S.openCats.filter(x=>x!==n):[...S.openCats,n];
      if(wasOpen&&S.cat===n){ S.cat='all'; S.sub=null; }
      else{ S.cat=n; S.sub=null; }
      LS.set('toolbox.openCats',S.openCats);
    }
  }
  if(s){
    const par=s.dataset.parent||S.cat;
    // 이미 그 분야의 같은 하위분야가 켜져 있으면 끄고, 아니면 그 분야까지 함께 켠다
    if(S.cat===par&&S.sub===s.dataset.sub) S.sub=null;
    else{ S.cat=par; S.sub=s.dataset.sub; if(!S.openCats.includes(par)){ S.openCats=[...S.openCats,par]; LS.set('toolbox.openCats',S.openCats); } }
  }
  if(g) S.tag=S.tag===g.dataset.tag?null:g.dataset.tag;
  if(m) S.mine=!S.mine;
  if(k) S.col=S.col===k.dataset.col?null:k.dataset.col;
  if(t||c||s||g||m||k){ S.cursor=-1; S.view='list'; render(); }
});

/* 화면 고르기: 시간대 스킨과 밝게/어둡게. 둘 다 기본은 자동이고 직접 고를 수 있다. */
const SKINS=[{k:'auto',n:'시간에 맞춰',h:''},{k:'dawn',n:'아침',h:'06–14'},{k:'day',n:'낮·저녁',h:'14–22'},{k:'night',n:'밤',h:'22–06'}];
const THEMES=[{k:'auto',n:'기기 설정에 맞춰'},{k:'light',n:'밝게'},{k:'dark',n:'어둡게'}];
const autoSkin=()=>{ const h=new Date().getHours(); return h<6?'night':h<14?'dawn':h<22?'day':'night' };
const getSkin=()=>{ const v=LS.get('toolbox.skin',''); return SKINS.some(x=>x.k===v&&v!=='auto')?v:'auto' };
const getTheme=()=>{ const v=LS.get('toolbox.theme',''); return (v==='light'||v==='dark')?v:'auto' };
function applyScreen(){
  const sk=getSkin(), th=getTheme();
  document.documentElement.dataset.skin = sk==='auto'?autoSkin():sk;
  if(th==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=th;
}
function closeSkinPop(){ const p=$('#skinPop'); if(p) p.remove(); $('#skinBtn').setAttribute('aria-expanded','false'); }
function openSkinPop(){
  if($('#skinPop')) return closeSkinPop();
  const sk=getSkin(), th=getTheme();
  const box=document.createElement('div'); box.className='skinpop'; box.id='skinPop';
  box.innerHTML=`<h5>시간대</h5>${SKINS.map(o=>`<button data-skin="${o.k}"><span class="mk">${o.k===sk?'●':''}</span>${esc(o.n)}${o.h?`<small>${o.h}</small>`:''}</button>`).join('')}
    <h5>화면</h5>${THEMES.map(o=>`<button data-theme="${o.k}"><span class="mk">${o.k===th?'●':''}</span>${esc(o.n)}</button>`).join('')}`;
  $('#skinBtn').parentElement.appendChild(box);
  $('#skinBtn').setAttribute('aria-expanded','true');
  box.addEventListener('click',e=>{
    const a=e.target.closest('[data-skin]'), b=e.target.closest('[data-theme]');
    if(a) LS.set('toolbox.skin',a.dataset.skin);
    if(b) LS.set('toolbox.theme',b.dataset.theme);
    if(a||b){ applyScreen(); closeSkinPop(); openSkinPop(); }
  });
}
$('#skinBtn').addEventListener('click',e=>{ e.stopPropagation(); openSkinPop(); });
document.addEventListener('click',e=>{ if($('#skinPop')&&!e.target.closest('.skinbtn')) closeSkinPop(); });

document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229) return;                                 // 한글 조합 중(IME)에는 단축키를 잡지 않는다
  const inField=/input|textarea|select/i.test(e.target.tagName);
  const onControl=/button|a|summary|details/i.test(e.target.tagName);        // 버튼·링크에 포커스가 있으면 Enter 는 그쪽 몫
  if(e.key==='Escape'){ if($('#skinPop')){ closeSkinPop(); return; } if($('#modalRoot').firstChild){ closeModal(); return; } if(inField){ e.target.blur(); } else if(S.sel){ S.sel=null; render(); } return; }
  if($('#modalRoot').firstChild||S.view!=='list') return;
  if(e.key==='/'&&!inField){ e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if(e.key==='n'&&!inField){ e.preventDefault(); openForm(null); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(inField&&e.target.id!=='q') return;
    e.preventDefault(); const n=filtered().length; if(!n)return;
    S.cursor=e.key==='ArrowDown'?Math.min(n-1,S.cursor+1):Math.max(0,S.cursor-1);
    render(); const r=$('#list').querySelector(`[data-i="${S.cursor}"]`); r&&r.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&!onControl&&(!inField||e.target.id==='q')){
    const list=filtered(); const it=list[S.cursor>=0?S.cursor:0]; if(!it) return;
    e.preventDefault(); if(inField) e.target.blur();
    S.sel=S.sel===it.id?null:it.id; if(S.cursor<0)S.cursor=0; render();
  }
});

function openLogin(reason){

    <div class="hint">비밀번호는 없습니다. 입력한 주소로 <b>6자리 코드</b>와 로그인 링크를 보내 드립니다. 코드를 입력하거나 링크를 누르면 로그인됩니다. 처음이면 자동으로 가입됩니다.</div>
    <div id="lfMsg"></div>
    <div id="lfCode" hidden>
      <label class="fld">메일로 받은 6자리 코드<input name="c" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" autocomplete="one-time-code"></label>
      <div class="hint">코드는 메일 본문에 있습니다. 링크가 안 열리거나 만료됐다고 나와도 코드는 그대로 쓸 수 있습니다.</div>
    </div>
    <div class="hint"><a href="#" id="lfHave" style="color:var(--muted)">이미 받은 코드가 있어요</a></div>
  </div><div class="modal-f"><span class="err" id="err"></span><button type="button" class="btn" data-close>취소</button><button class="btn primary" id="lfBtn">코드·링크 보내기</button><button class="btn primary" id="lfVerify" hidden>코드로 로그인</button></div></form>`,'narrow');
  const f=$('#lf'); if(!provs.length) f.e.focus();
  f.querySelectorAll('[data-prov]').forEach(b=>b.addEventListener('click',async()=>{
    $('#err').textContent=''; b.disabled=true;
    try{ await store.loginWith(b.dataset.prov); }
    catch(x){ const m=x.message||''; $('#err').textContent=/not enabled|unsupported provider/i.test(m)?`${PROVIDERS[b.dataset.prov].label.replace('로 계속하기','')} 로그인이 아직 Supabase 에서 켜져 있지 않습니다.`:'로그인을 시작하지 못했습니다: '+(m||x.code||'오류'); b.disabled=false; }
  }));
  const showCode=()=>{ $('#lfCode').hidden=false; $('#lfVerify').hidden=false; $('#lfHave').parentElement.hidden=true; (f.e.value.trim()?f.c:f.e).focus(); };
  $('#lfHave').addEventListener('click',e=>{ e.preventDefault(); showCode(); });
  f.c.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); f.requestSubmit($('#lfVerify')); } });
  f.addEventListener('submit',async e=>{
    e.preventDefault(); const email=f.e.value.trim(); $('#err').textContent='';
    const verifying=e.submitter&&e.submitter.id==='lfVerify';
    if(verifying){
      if(!email){ $('#err').textContent='이메일을 입력해 주세요.'; f.e.focus(); return; }
      const code=f.c.value.trim(); if(!/^\d{6}$/.test(code)){ $('#err').textContent='숫자 6자리를 입력해 주세요.'; f.c.focus(); return; }
      $('#lfVerify').disabled=true;
      try{ await store.verifyCode(email,code); closeModal(); toast('로그인했습니다'); }
      catch(x){ const m=x.message||''; $('#err').textContent=/expired|invalid/i.test(m)?'코드가 틀리거나 만료되었습니다. 메일의 최신 코드를 확인해 주세요.':'로그인하지 못했습니다: '+(m||x.code||'오류'); $('#lfVerify').disabled=false; }
      return;
    }
    $('#lfBtn').disabled=true;
    try{ await store.login(email); $('#lfMsg').innerHTML=`<div class="ok">✓ <b>${esc(email)}</b> 로 보냈습니다. 메일함(스팸함 포함)에서 6자리 코드를 아래에 입력하거나 링크를 눌러 주세요.</div>`; $('#lfBtn').hidden=true; showCode(); }
    catch(x){
      const msg=x.message||'', m=msg.match(/after (\d+) seconds?/i), rate=m||x.code==='over_email_send_rate_limit'||/rate limit/i.test(msg);
      if(!rate){ $('#err').textContent='메일을 보내지 못했습니다: '+(msg||x.code||'오류'); $('#lfBtn').disabled=false; return; }
      let left=m?+m[1]:60;
      $('#lfMsg').innerHTML=`<div class="hint" style="font-size:13px">방금 보낸 메일이 있습니다. 메일함(스팸함 포함)에서 6자리 코드를 찾아 아래에 입력해 주세요. 안 왔다면 잠시 후 다시 보낼 수 있습니다.</div>`;
      showCode();
      const btn=$('#lfBtn'), tick=()=>{ if(!document.body.contains(btn)) return; if(left<=0){ btn.disabled=false; btn.textContent='다시 보내기'; return; } btn.textContent=`${left}초 후 다시 보내기`; left--; setTimeout(tick,1000); };
      tick();
    }
  });
}

/* ---------- AI 정리 (운영자): 항목 재분류 + 분야 구조 개편안 ---------- */
function openAiOrganize(){
  if(!aiReady()){ toast('운영자만 쓸 수 있습니다'); return; }
  const empty=S.items.filter(i=>!i.category&&!i.example), vis=filtered().filter(i=>!i.example);
  modal(`${mh('✦ AI 정리')}<div class="modal-b">
    <div class="ai-sec">
      <h3>1. 항목 다시 분류</h3>
      <p class="hint">AI 가 항목을 읽고 분야·하위분야·태그를 제안합니다. 바꿀 것만 표로 보여 주고, 체크한 항목만 적용됩니다. 30개씩 나눠 처리하며 한 묶음에 10~30초쯤 걸립니다.</p>
      <div class="ai-opts">
        <label><input type="radio" name="scope" value="empty" ${empty.length?'checked':''}> 분야가 비어 있는 항목 <b>${empty.length}</b></label>
        <label><input type="radio" name="scope" value="list" ${empty.length?'':'checked'}> 지금 보이는 목록 <b>${vis.length}</b></label>
        <label><input type="radio" name="scope" value="all"> 전체 <b>${S.items.filter(i=>!i.example).length}</b></label>
      </div>
      <div class="ai-row"><button type="button" class="btn small" id="orgBtn">✦ 제안 받기</button><span class="hint" id="orgMsg"></span></div>
      <div id="orgOut"></div>
    </div>
    <div class="ai-sec">
      <h3>2. 분야 구조 개편안</h3>
      <p class="hint">전체 자료를 보고 하위분야를 더하거나 빼는 안을 냅니다. 아래 칸에서 고친 뒤 저장하면 "분야 편집"과 같은 방식으로 반영됩니다.</p>
      <div class="ai-row"><button type="button" class="btn small" id="taxBtn">✦ 제안 받기</button><span class="hint" id="taxMsg"></span></div>
      <div id="taxOut"></div>
    </div>
  </div><div class="modal-f"><button type="button" class="btn" data-close>닫기</button></div>`,'wide');
  const veil=$('#veil'); let props=[];
  $('#orgBtn').addEventListener('click',async()=>{
    const scope=veil.querySelector('input[name=scope]:checked').value;
    const ids=(scope==='empty'?empty:scope==='list'?vis:S.items.filter(i=>!i.example)).map(i=>i.id);
    const msg=$('#orgMsg'), out=$('#orgOut'), btn=$('#orgBtn');
    if(!ids.length){ msg.textContent='대상 항목이 없습니다.'; return; }
    btn.disabled=true; out.innerHTML=''; props=[]; let same=0, done=0;
    const alive=()=>document.body.contains(veil);   // 창을 닫으면 더 부르지 않는다
    try{
      for(let i=0;i<ids.length;i+=30){
        if(!alive()) return;
        msg.textContent=`AI 가 검토하는 중… ${done}/${ids.length}`;
        const r=await store.ai('organize',{ids:ids.slice(i,i+30)});
        (r.proposals||[]).forEach(p=>{ if(p.changed) props.push(p); else same++; });
        done=Math.min(ids.length,i+30);
      }
      if(!alive()) return;
      msg.textContent=`검토 완료: ${ids.length}개 중 ${props.length}개 변경 제안, ${same}개는 지금 분류가 적절합니다.`;
    }catch(x){ if(!alive()) return; msg.textContent='실패: '+(x.message||x.code||'오류')+(props.length?` (그 전까지 받은 ${props.length}개 제안은 아래에 있습니다)`:''); }
    renderProps(); btn.disabled=false;
  });
  function renderProps(){
    const out=$('#orgOut'); if(!props.length){ out.innerHTML=''; return; }
    out.innerHTML=`<div class="ai-wrap"><table class="ai-tbl"><tr><th><input type="checkbox" id="orgAll" checked></th><th>항목</th><th>지금</th><th>제안</th><th>이유</th></tr>${props.map((p,i)=>{ const c=byId(p.id);
      return `<tr><td><input type="checkbox" data-pi="${i}" checked></td><td>${esc(c.title||p.id)}</td><td class="ai-old">${esc(c.category||'(없음)')}${c.sub?' › '+esc(c.sub):''}<br>${(c.tags||[]).map(t=>'#'+esc(t)).join(' ')}</td><td class="ai-new">${esc(p.category)}${p.sub?' › '+esc(p.sub):''}${p.newSub?' <span class="ai-tag">새 하위분야</span>':''}<br>${(p.tags||[]).map(t=>'#'+esc(t)).join(' ')}</td><td class="hint">${esc(p.reason||'')}</td></tr>` }).join('')}</table></div>
      <div class="ai-row"><button type="button" class="btn primary small" id="orgApply">체크한 항목 적용</button><span class="hint" id="orgApplyMsg"></span></div>`;
    $('#orgAll').addEventListener('change',e=>out.querySelectorAll('[data-pi]').forEach(c=>c.checked=e.target.checked));
    $('#orgApply').addEventListener('click',async()=>{
      const sel=[...out.querySelectorAll('[data-pi]:checked')].map(c=>props[+c.dataset.pi]); const m=$('#orgApplyMsg');
      if(!sel.length){ m.textContent='선택한 항목이 없습니다.'; return; }
      $('#orgApply').disabled=true; let ok=0,fail=0;
      for(const p of sel){ try{ await store.patch(p.id,{category:p.category,sub:p.sub||'',tags:p.tags||[],updatedAt:new Date().toISOString()}); ok++; }catch(x){ fail++; } m.textContent=`적용 중… ${ok+fail}/${sel.length}`; }
      // 새 하위분야는 분야 목록에도 추가
      const merged=S.cats.map(c=>({...c,subs:c.subs.slice()})); let added=0;
      sel.forEach(p=>{ if(!p.sub) return; const c=merged.find(x=>x.name===p.category); if(c&&!c.subs.includes(p.sub)){ c.subs.push(p.sub); added++; } });
      if(added){ try{ await store.saveCategories(merged); }catch(x){ added=0; } }
      m.textContent=`완료: ${ok}개 적용${fail?`, ${fail}개 실패`:''}${added?`, 하위분야 ${added}개 추가`:''}`;
      toast(`${ok}개 항목을 다시 분류했습니다`);
      props=props.filter(p=>!sel.includes(p)); if(!props.length){ $('#orgMsg').textContent=m.textContent; out.innerHTML=''; }
      else renderProps();
    });
  }
  $('#taxBtn').addEventListener('click',async()=>{
    const msg=$('#taxMsg'), out=$('#taxOut'), btn=$('#taxBtn');
    btn.disabled=true; msg.textContent='AI 가 전체 자료를 살펴보는 중… (30초쯤 걸립니다)'; out.innerHTML='';
    try{
      const r=await store.ai('taxonomy',{}); const list=normCats(r.list);
      if(!list.length) throw new Error('제안을 받지 못했습니다');
      msg.textContent=`자료 ${r.itemCount||S.items.length}개를 보고 만든 안입니다. 고친 뒤 저장하세요.`;
      out.innerHTML=`${(r.notes||[]).length?`<ul class="ai-notes">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
        <div class="two"><label class="fld">지금<textarea class="code" readonly style="min-height:150px">${esc(catsToText(S.cats))}</textarea></label>
        <label class="fld">제안 (수정 가능)<textarea class="code" id="taxText" style="min-height:150px">${esc(catsToText(list))}</textarea></label></div>
        <div class="ai-row"><button type="button" class="btn primary small" id="taxSave">이 구조로 저장</button><span class="hint">분야 이름을 바꿔도 기존 항목의 분야 표기는 그대로입니다. 항목까지 옮기려면 위의 "항목 다시 분류"를 쓰세요.</span></div>`;
      $('#taxSave').addEventListener('click',async()=>{
        const l=parseCatText($('#taxText').value); if(!l.length){ msg.textContent='분야가 하나는 있어야 합니다.'; return; }
        try{ await store.saveCategories(l); toast('분야 구조를 저장했습니다'); msg.textContent='저장했습니다. 왼쪽 분야 목록에 반영됩니다.'; }catch(x){ msg.textContent='저장하지 못했습니다 ('+(x.message||x.code||'오류')+')'; }
      });
    }catch(x){ msg.textContent='실패: '+(x.message||x.code||'오류'); }
    btn.disabled=false;
  });
}

function openIO(){
  modal(`${mh('파일로 관리')}<div class="modal-b">
      <p style="margin:0;color:var(--muted)">전체 항목과 모음을 JSON 파일로 내보내거나, 파일을 골라 한 번에 넣을 수 있습니다. 같은 id 는 덮어쓰고 새 id 는 추가됩니다.</p>
      <div class="two">
        <button class="btn" id="exportBtn">⇩ JSON 내보내기</button>
        <label class="btn" style="justify-content:center">⇧ JSON 가져오기<input type="file" accept="application/json,.json" id="importFile" hidden></label>
      </div>
      <div class="hint">새 항목은 내 글로 등록되고, 이미 있는 항목은 올린 사람이 그대로 유지됩니다. 가져오기는 로그인이 필요합니다.</div>
      <div class="hint" id="ioMsg"></div>
  </div>`);
  $('#exportBtn').addEventListener('click',()=>{
    const data=JSON.stringify({exportedAt:new Date().toISOString(),categories:S.cats,items:S.items.filter(x=>!x.example),collections:S.cols},null,2);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='toolbox-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('내보냈습니다');
  });
  $('#importFile').addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f)return; const msg=$('#ioMsg');
    if(!await ensureName()) return;
    try{
      const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:(j.items||[]);
      if(!arr.length) throw new Error('항목이 없습니다');
      let ok=0,fail=0;
      for(const raw of arr){
        const rid=okId(raw.id)?String(raw.id):uid();                 // 이상한 id 는 새로 만든다 (화면 속성에 그대로 들어가므로)
        const ex=S.items.find(x=>x.id===rid);
        const it={id:rid,type:TYPES[raw.type]?raw.type:'link',title:String(raw.title||raw.url||'(제목 없음)'),url:String(raw.url||''),lang:String(raw.lang||''),body:String(raw.body||''),category:String(raw.category||''),sub:String(raw.sub||''),tags:Array.isArray(raw.tags)?raw.tags.map(String):[],
          // 이미 있는 항목은 올린 사람·소유자·수정시각을 그대로 둔다 (백업 복원 시 소유권이 넘어가지 않게)
          by:ex?ex.by:String(raw.by||ME.name),ownerId:ex?ex.ownerId:ME.id,createdAt:ex?ex.createdAt:(raw.createdAt||new Date().toISOString()),updatedAt:ex?ex.updatedAt:(raw.updatedAt||null)};
        if(ex&&!canEdit(ex)){ fail++; continue; }
        try{ await store.put(it); ok++; }catch(x){ fail++; }
        msg.textContent=`가져오는 중… ${ok+fail}/${arr.length}`;
      }
      if(Array.isArray(j.collections)) for(const c of j.collections){ if(!(c&&okId(c.id)&&c.title)) continue;
        const ex=S.cols.find(x=>x.id===c.id); if(ex&&!canEdit(ex)) continue;
        await store.putCol({id:String(c.id),title:String(c.title),desc:String(c.desc||''),itemIds:(Array.isArray(c.itemIds)?c.itemIds:[]).filter(okId),
          by:ex?ex.by:String(c.by||ME.name),ownerId:ex?ex.ownerId:ME.id,createdAt:ex?ex.createdAt:(c.createdAt||new Date().toISOString())}); }
      if(S.admin&&Array.isArray(j.categories)&&j.categories.length){ const merged=S.cats.slice(); normCats(j.categories).forEach(c=>{ const ex=merged.find(x=>x.name===c.name); if(ex) ex.subs=[...new Set([...ex.subs,...c.subs])]; else merged.push({name:c.name,subs:c.subs}); }); await store.saveCategories(merged); }
      msg.textContent=`완료: ${ok}개 추가·갱신${fail?`, ${fail}개 건너뜀(권한 없음 또는 실패)`:''}`; toast(`${ok}개를 가져왔습니다`);
    }catch(x){ msg.textContent='읽을 수 없는 파일입니다: '+(x.message||x); }
    e.target.value='';
  });
}

/* ================================================================
   시작
   ================================================================ */
function setConn(kind){
  const p=$('#conn'); p.className='pill '+(kind==='db'?'live':kind==='err'?'err':'local');
  p.querySelector('span').textContent=kind==='db'?'실시간 연결됨':kind==='err'?'실시간 연결 끊김':'미리보기 모드';
  p.title=kind==='db'?'다른 사람이 올린 항목이 바로 나타납니다':kind==='err'?'새로고침하면 최신 내용을 다시 불러옵니다':'설정(config.js)이 비어 있어 이 브라우저에만 저장됩니다';
}
document.title=CFG.SITE_NAME||'빠른 연결'; $('#siteName').textContent=CFG.SITE_NAME||'빠른 연결'; $('#siteTag').textContent=CFG.SITE_TAGLINE||'';
// 태그 목록: 넓은 화면은 펼침, 모바일은 접힘 (사용자가 여닫으면 그대로 둠)
(function(){
  const narrow=matchMedia('(max-width:820px)').matches;
  // 기본: 넓은 화면은 종류·분야·모음 펼침, 좁은 화면은 모두 접힘. 사용자가 여닫으면 그 선택을 기억한다.
  [['typeBox',!narrow],['catBox',!narrow],['colBox',!narrow],['tagBox',!narrow]].forEach(([id,def])=>{
    const el=$('#'+id); if(!el) return;
    el.open=LS.get('toolbox.open.'+id,def);
    el.addEventListener('toggle',()=>LS.set('toolbox.open.'+id,el.open));
  });
})();
render();
(function(){
  const ready=CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase;
  store=ready?SupabaseStore():LocalStore();
  if(!ready){ setConn('local'); $('#notice').innerHTML=`<div class="notice"><b>미리보기 모드</b>입니다. <code>config.js</code>에 Supabase 주소와 키를 넣으면 실제 공유 사이트로 동작합니다. 지금은 이 브라우저에만 저장되고, 운영자 화면을 미리 볼 수 있습니다.</div>`; }
  store.onAuth(me=>{ Object.assign(ME,{id:me.id,name:me.name,email:me.email,provider:me.provider||'',suggestedName:me.suggestedName||''}); S.admin=!!me.admin; render(); });
  S.openCats=(LS.get('toolbox.openCats',[])||[]).filter(x=>typeof x==='string');
  store.subscribe(d=>{ Object.assign(S,{items:d.items,cats:d.cats,cols:d.cols,reports:d.reports,myVotes:d.myVotes||[]}); render(); });
  // 메일 링크가 만료·사용됨 상태로 돌아온 경우: 주소의 오류를 읽어 안내하고 코드 입력으로 유도
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(ready&&h.get('error')){
    const code=h.get('error_code')||'', desc=h.get('error_description')||'';
    history.replaceState(null,'',location.pathname+location.search);
    const why=code==='otp_expired'?'로그인 링크가 만료되었거나 이미 사용되었습니다. 메일 보안 프로그램이 링크를 먼저 열어 보는 경우 이렇게 됩니다. 링크 대신 메일 속 6자리 코드를 입력해 주세요.':'로그인하지 못했습니다: '+desc.replace(/\+/g,' ');
    openLogin(why);
    if(code==='otp_expired') $('#lfHave').click();
  }
})();
</script>
