  const catCnt={}; sc.all.forEach(i=>{ if(i.categoryId) catCnt[i.categoryId]=(catCnt[i.categoryId]||0)+1; });
  const expCats=S.cats.map(c=>({id:c.id,name:c.name}));
  sc.all.forEach(i=>{ if(i.categoryId&&!expCats.some(c=>c.id===i.categoryId)) expCats.push({id:i.categoryId,name:i.category||'(이름 없는 분야)'}); });
  const expPre=(S.catId!=='all'&&expCats.some(c=>c.id===S.catId))?S.catId:((expCats[0]||{}).id||'');
  modal(`${mh('✦ AI 정리')}<div class="modal-b">
    <div class="ai-sec">
      <h3>1. 항목 다시 분류</h3>
      <p class="hint">AI 가 항목을 읽고 분야·하위분야·태그를 제안하고, <b>링크가 살아 있는지도 함께 확인</b>합니다. 바꿀 것만 표로 보여 주고 체크한 항목만 적용됩니다. 30개씩 나눠 처리하며 한 묶음에 10~30초쯤 걸립니다. 살펴본 항목에는 점검 시각이 남아, 다음에 "오래 확인 안 한 것"으로 골라낼 수 있습니다.</p>
      <div class="ai-opts">
        <label><input type="radio" name="scope" value="empty" ${sc.empty.length?'checked':''}> 분야가 비어 있는 것 <b>${sc.empty.length}</b></label>
        <label><input type="radio" name="scope" value="never" ${!sc.empty.length&&sc.never.length?'checked':''}> 한 번도 확인 안 한 것 <b>${sc.never.length}</b></label>
        <label><input type="radio" name="scope" value="d30"> 30일 넘게 확인 안 한 것 <b>${sc.d30.length}</b></label>
        <label><input type="radio" name="scope" value="d7"> 7일 넘게 확인 안 한 것 <b>${sc.d7.length}</b></label>
        <label><input type="radio" name="scope" value="list" ${!sc.empty.length&&!sc.never.length?'checked':''}> 지금 보이는 목록 <b>${sc.list.length}</b></label>
        <label><input type="radio" name="scope" value="all"> 전체 <b>${sc.all.length}</b></label>
      </div>
      <div class="ai-row"><button type="button" class="btn small" id="orgBtn">✦ 제안 받기</button><span class="hint" id="orgMsg" aria-live="polite"></span></div>
      <div id="orgOut"></div>
    </div>
    <div class="ai-sec">
      <h3>2. 분야 구조 개편안</h3>
      <p class="hint">전체 자료를 보고 하위분야를 더하거나 빼는 안을 냅니다. 아래 칸에서 고친 뒤 저장하면 "분야 편집"과 같은 방식으로 반영됩니다.</p>
      <div class="ai-row"><button type="button" class="btn small" id="taxBtn">✦ 제안 받기</button><span class="hint" id="taxMsg" aria-live="polite"></span></div>
      <div id="taxOut"></div>
    </div>
    <div class="ai-sec">
      <h3>3. 분야에 자료 채우기</h3>
      <p class="hint">고른 분야에 넣을 자료를 AI 가 제안합니다. 링크는 서버가 실제로 열어 보고, 이미 있는 자료와 겹치는지, 위험한 명령이 섞였는지도 확인합니다. <b>체크한 것만 추가됩니다.</b> 30초에서 1분쯤 걸리고 하루 AI 사용량 15회분을 씁니다(개수를 줄여도 같습니다). 창을 닫아도 요청은 그대로 진행되고, 받은 제안은 잠시 남아 있어 다시 열면 이어서 볼 수 있습니다.</p>
      <div class="ai-fields">
        <label class="fld">분야<select id="expCat">
          ${expCats.map(c=>`<option value="${esc(c.id)}" ${c.id===expPre?'selected':''}>${esc(c.name)} (${catCnt[c.id]||0}개)</option>`).join('')}
          <option value="__new">＋ 새 분야 직접 입력</option></select></label>
        <label class="fld">주제 힌트 (선택)<input id="expTopic" maxlength="80" placeholder="예: 무료로 쓸 수 있는 것 위주"></label>
        <label class="fld" id="expNewWrap" hidden>새 분야 이름<input id="expNew" maxlength="60" placeholder="예: 글쓰기·기획"></label>
        <label class="fld" id="expSubWrap" hidden>하위분야 (선택, 쉼표로 구분)<input id="expSubs" maxlength="200" placeholder="예: 자료조사, 초고, 다듬기"></label>
        <label class="fld">개수<select id="expCount"><option>5</option><option>8</option><option selected>10</option></select></label>
        <label class="fld">종류 배합<select id="expMix">
          <option value="link" selected>링크 위주</option><option value="even">고루 섞기</option><option value="text">메모·코드 위주</option></select></label>
      </div>
      <div class="ai-row"><button type="button" class="btn small" id="expBtn">✦ 제안 받기</button><span class="hint" id="expMsg" aria-live="polite"></span></div>
      <div id="expOut"></div>
    </div>
  </div><div class="modal-f"><button type="button" class="btn" data-close>닫기</button></div>`,'wide');
  const veil=$('#veil'); const alive=()=>document.body.contains(veil);   // 창을 닫으면 화면을 더 만지지 않는다
  let props=[], links=[], exp=null;
  $('#orgBtn').addEventListener('click',async()=>{
    const scope=veil.querySelector('input[name=scope]:checked').value;
    const now=scopes();                                  // 누른 시점으로 다시 센다
    const ids=(now[scope]||now.all).map(i=>i.id);
    const msg=$('#orgMsg'), out=$('#orgOut'), btn=$('#orgBtn');
    if(!ids.length){ msg.textContent='대상 항목이 없습니다.'; return; }
    btn.disabled=true; out.innerHTML=''; props=[]; links=[]; let same=0, done=0, markFail='';
    try{
      for(let i=0;i<ids.length;i+=30){
        if(!alive()) return;
        msg.textContent=`AI 가 검토하는 중… ${done}/${ids.length}`;
        const r=await store.ai('organize',{ids:ids.slice(i,i+30)});
        (r.proposals||[]).forEach(p=>{
          if(p.link&&p.link.state&&p.link.state!=='none'&&p.link.state!=='ok') links.push({id:p.id,...p.link});
          if(p.changed) props.push(p); else same++;
        });
        // 묶음마다 바로 기록한다. 뒤에서 실패해도 이미 값을 치른 앞 묶음을 다시 검토하지 않도록.
        if((r.checkedIds||[]).length){
          try{ await store.markChecked(r.checkedIds); }
          catch(e){ if(!markFail) markFail=e.message||'오류'; }   // 안내는 한 번만, 시도는 묶음마다
        }
        done=Math.min(ids.length,i+30);
      }
      if(!alive()) return;
      const dead=links.filter(l=>l.state==='dead').length, unk=links.filter(l=>l.state==='unknown').length;
      msg.textContent=`검토 완료: ${ids.length}개 중 ${props.length}개 변경 제안, ${same}개는 지금 분류가 적절합니다.`
        + (dead?` 링크 ${dead}개가 사라진 것 같습니다.`:'')
        + (unk?` ${unk}개는 확인하지 못했습니다.`:'')
        + (markFail?` (점검 시각은 남기지 못했습니다: ${markFail})`:'');
    }catch(x){ if(!alive()) return; msg.textContent='실패: '+(x.message||x.code||'오류')+(props.length?` (그 전까지 받은 ${props.length}개 제안은 아래에 있습니다)`:''); }
    renderProps(); btn.disabled=false;
  });
  const LK={ok:['정상','ok'],dead:['없음','dead'],unknown:['확인 불가','unknown']};
  function lkBadge(l){ if(!l||!l.state||l.state==='none'||!LK[l.state]) return '';
    const [t,c]=LK[l.state]; return ' <span class="lk '+c+'" title="'+esc(l.note||'')+'">'+t+'</span>'; }
  function renderProps(){
    const out=$('#orgOut');
    // 분류 제안이 있든 없든, 링크에 문제가 있으면 따로 모아 보여 준다
    const linkOnly=links.filter(l=>!props.some(p=>p.id===l.id));
    const linkTbl=linkOnly.length?`<div class="ai-wrap"><table class="ai-tbl"><thead><tr><th>항목</th><th>링크</th><th>주소</th></tr></thead><tbody>${
      linkOnly.map(l=>{ const c=byId(l.id); return `<tr><td>${esc(c.title||l.id)}</td><td>${lkBadge(l)}</td><td class="hint">${esc(c.url||'')}</td></tr>` }).join('')
      }</tbody></table></div><p class="hint">분류는 그대로 두어도 됩니다. 위 링크는 직접 열어 확인한 뒤 고치거나 지우세요.</p>`:'';
    if(!props.length){ out.innerHTML=linkTbl; return; }
    out.innerHTML=`<div class="ai-row"><label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="orgAll" checked aria-label="전체 선택"> 전체 선택</label></div>
      <div class="ai-wrap"><table class="ai-tbl"><thead><tr><th>적용</th><th>항목</th><th>지금</th><th>제안</th><th>이유</th></tr></thead><tbody>${props.map((p,i)=>{ const c=byId(p.id);
      return `<tr><td><input type="checkbox" data-pi="${i}" checked aria-label="적용 대상으로 선택: ${esc(c.title||p.id)}"></td><td>${esc(c.title||p.id)}${lkBadge(p.link)}</td><td class="ai-old">${esc(catOfItem(c)||'(없음)')}${c.sub?' › '+esc(c.sub):''}<br>${(c.tags||[]).map(t=>'#'+esc(t)).join(' ')}</td><td class="ai-new">${esc(p.category)}${p.sub?' › '+esc(p.sub):''}${p.newSub?' <span class="ai-tag">새 하위분야</span>':''}<br>${(p.tags||[]).map(t=>'#'+esc(t)).join(' ')}</td><td class="hint">${esc(p.reason||'')}</td></tr>` }).join('')}</tbody></table></div>
      <div class="ai-row"><button type="button" class="btn primary small" id="orgApply">체크한 항목 적용</button><span class="hint" id="orgApplyMsg" aria-live="polite"></span></div>${linkTbl}`;
    $('#orgAll').addEventListener('change',e=>out.querySelectorAll('[data-pi]').forEach(c=>c.checked=e.target.checked));
    $('#orgApply').addEventListener('click',async()=>{
      const sel=[...out.querySelectorAll('[data-pi]:checked')].map(c=>props[+c.dataset.pi]); const m=$('#orgApplyMsg');
      if(!sel.length){ m.textContent='선택한 항목이 없습니다.'; return; }
      $('#orgApply').disabled=true; let ok=0,fail=0,why='';
      for(const p of sel){
        if(!p.categoryId&&!p.category){ fail++; if(!why) why='AI 가 분야를 정하지 못한 제안이 있습니다'; continue; }   // 분야를 못 정한 제안. 적용하면 자료가 분야를 잃는다
        // 실패 이유를 하나는 그대로 보여 준다. "분야 목록이 그 사이에 바뀌었습니다" 처럼
        // 사용자가 새로 고치면 풀리는 것을 개수만 보고는 알 수 없다.
        try{ await store.patch(p.id,{...(p.categoryId?{categoryId:p.categoryId}:{}),category:p.category,sub:p.sub||'',tags:p.tags||[],updatedAt:new Date().toISOString()}); ok++; }catch(x){ fail++; if(!why) why=x.message||x.code||''; }
        m.textContent=`적용 중… ${ok+fail}/${sel.length}`; }
      // 새 하위분야는 분야 목록에도 추가
      const merged=S.cats.map(c=>({...c,subs:c.subs.slice()})); let added=0;
      sel.forEach(p=>{ if(!p.sub) return; const c=merged.find(x=>p.categoryId?x.id===p.categoryId:x.name===p.category); if(c&&!c.subs.includes(p.sub)){ c.subs.push(p.sub); added++; } });
      if(added){ try{ await store.saveCategories(merged); }catch(x){ added=0; } }
      const line=`완료: ${ok}개 적용${fail?`, ${fail}개 실패`:''}${added?`, 하위분야 ${added}개 추가`:''}`+(why?` · ${why}`:'');
      m.textContent=line;
      toast(`${ok}개 항목을 다시 분류했습니다`);
      props=props.filter(p=>!sel.includes(p));
      if(!props.length) $('#orgMsg').textContent=line;   // 남은 링크 문제 표는 renderProps 가 다시 그린다
      renderProps();
      const m2=$('#orgApplyMsg'); if(m2) m2.textContent=line;   // 다시 그리면서 안내가 지워지지 않도록
    });
  }
  $('#taxBtn').addEventListener('click',async()=>{
    const msg=$('#taxMsg'), out=$('#taxOut'), btn=$('#taxBtn');
    btn.disabled=true; msg.textContent='AI 가 전체 자료를 살펴보는 중… (30초쯤 걸립니다)'; out.innerHTML='';
    try{
      const r=await store.ai('taxonomy',{}); const list=normCats(r.list);
      if(!list.length) throw new Error('제안을 받지 못했습니다');
      const cnt=catCounts();
      // 옛 함수는 id 를 안 준다. 그때는 이름으로라도 이어 붙여야 개명 아닌 변경이 살아남는다.
      // renamedFrom 은 normCats 가 떨구는 값이라 여기서 다시 붙인다. 화면 안내에만 쓰고 저장하지는 않는다
      // (readCatRows 는 입력칸만 읽으므로 settings 에는 들어가지 않는다).
      const wasNamed={}; (Array.isArray(r.list)?r.list:[]).forEach(c=>{ if(c&&c.renamedFrom) wasNamed[String(c.id||c.name||'')]=String(c.renamedFrom); });
      // 응답에 id 가 하나라도 있으면 새 함수다. 그때는 이름으로 되붙이지 않는다.
      // 새 함수는 같은 id 를 두 줄에 쓴 응답의 뒷줄을 일부러 id 없이 강등해 "새 분야" 로 만드는데,
      // 여기서 이름으로 도로 붙이면 그 방어가 통째로 무효가 되어 자료가 남의 이름 밑으로 들어간다.
      const hasIds=(Array.isArray(r.list)?r.list:[]).some(c=>c&&c.id);
      const fixed=list.map(c=>{ const o=(c.id||hasIds)?c:{...c,id:((S.cats.find(x=>x.name===c.name)||{}).id||'')};
        const was=wasNamed[c.id||c.name]; return was?{...o,renamedFrom:was}:o; });
      msg.textContent=`자료 ${r.itemCount||S.items.length}개를 보고 만든 안입니다. 고친 뒤 저장하세요.`;
      out.innerHTML=`${(r.notes||[]).length?`<ul class="ai-notes">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
        <label class="fld">지금<textarea class="code" readonly style="min-height:100px">${esc(catsToText(S.cats))}</textarea></label>
        <div class="hint" style="margin:10px 0 5px">제안 (고칠 수 있습니다)</div>
        <div id="taxRows">${catRowsHTML(fixed,cnt)}</div>
        <div class="ai-row" style="margin-top:8px"><button type="button" class="btn primary small" id="taxSave">이 구조로 저장</button><span class="hint">이름을 바꿔도 그 분야의 자료와 담당자는 따라옵니다. 자료를 다른 분야로 옮기려면 위의 "항목 다시 분류"를 쓰세요.</span></div>`;
      bindCatRows($('#taxRows'),cnt);
      $('#taxSave').addEventListener('click',async()=>{
        const l=readCatRows($('#taxRows')), bad=catRowsError(l);
        if(bad){ msg.textContent=bad; return; }
        try{ await store.saveCategories(l); toast('분야 구조를 저장했습니다'); msg.textContent='저장했습니다. 왼쪽 분야 목록에 반영됩니다.'; }catch(x){ msg.textContent='저장하지 못했습니다 ('+(x.message||x.code||'오류')+')'; }
      });
    }catch(x){ msg.textContent='실패: '+(x.message||x.code||'오류'); }
    btn.disabled=false;
  });

  /* ---------- 3. 분야에 자료 채우기 ---------- */
  const NEEDNAME='자료를 올리려면 이름이 필요합니다. "더 보기 › 이름 바꾸기"에서 먼저 정해 주세요.';
  // 서버가 막은 것과 이 사이트의 저장 조건을 못 넘는 것은 아예 고를 수 없게 한다
  const expBad=p=> p.risk==='block' || !p.title || (p.type!=='link'&&!p.body) || (p.type==='link'&&!safeUrl(p.url));
  const expBadWhy=p=> p.risk==='block' ? '되돌릴 수 없는 명령이 들어 있어 추가할 수 없습니다. 필요하면 아래 내용을 보고 "새 항목"으로 직접 올려 주세요.'
    : !p.title ? '제목이 비어 있어 추가할 수 없습니다.'
    : p.type==='snippet' ? '코드가 비어 있어 추가할 수 없습니다.'
    : p.type==='note' ? '내용이 비어 있어 추가할 수 없습니다.'
    : '열 수 없는 주소라 추가할 수 없습니다.';
  // 기본으로 켜 두는 조건. 중복과 죽은 링크는 꺼 두고, "확인 불가" 는 켜 둔다 —
  // 서버는 404·없는 주소만 '없음' 으로 찍고, 봇을 막는 멀쩡한 사이트가 '확인 불가' 로 오기 때문이다.
  const expSafe=p=> !expBad(p) && p.risk!=='warn' && (p.dup||'none')==='none' && !(p.link&&p.link.state==='dead');
  const DUPW={url:'같은 주소의 자료가 이미 있습니다.',title:'제목이 같은 자료가 이미 있습니다.',batch:'이번 제안 안에서 앞의 것과 겹칩니다.'};
  const DUPB={url:'이미 있는 주소',title:'제목이 같음',batch:'제안 안에서 겹침'};
  const expWarn=p=>{ const a=[];
    if(p.risk==='warn') a.push('되돌릴 수 없는 명령이 글 안에 들어 있습니다. 설명하는 글인지 읽어 보고 고르세요.');
    if(DUPW[p.dup]) a.push(DUPW[p.dup]);
    if(p.link&&p.link.state==='dead') a.push((p.link.note||'주소가 열리지 않습니다')+'. 직접 확인한 뒤 추가해 주세요.');
    if(p.link&&p.link.state==='unknown') a.push((p.link.note||'확인하지 못했습니다')+'. 주소를 눌러 열어 보고 판단해 주세요.');
    return a; };
  const expSummary=r=>{
    const g=r.mixGot||{}, it=exp.items, parts=[];
    if(g.link) parts.push(`링크 ${g.link}`); if(g.note) parts.push(`메모 ${g.note}`); if(g.snippet) parts.push(`코드 ${g.snippet}`);
    const cnt=f=>it.filter(f).length;
    const dead=cnt(p=>p.link&&p.link.state==='dead'), unk=cnt(p=>p.link&&p.link.state==='unknown');
    const dup=cnt(p=>!expBad(p)&&(p.dup||'none')!=='none'), blk=cnt(expBad), warn=cnt(p=>!expBad(p)&&p.risk==='warn');
    return `제안 ${it.length}개${parts.length?` (${parts.join(' · ')})`:''}.`
      + (r.dropped?` ${r.dropped}개는 주소나 내용이 비어 있어 서버가 걸렀습니다.`:'')
      + (dead?` 링크 ${dead}개가 사라진 것 같습니다.`:'')
      + (unk?` ${unk}개는 확인하지 못했습니다 — 눌러서 직접 열어 보세요.`:'')
      + (dup?` 이미 있는 것과 겹치는 ${dup}개는 체크를 꺼 두었습니다.`:'')
      + (blk?` 위험하거나 저장할 수 없는 ${blk}개는 고를 수 없습니다.`:'')
      + (warn?` 명령이 들어 있는 ${warn}개는 체크를 꺼 두었습니다 — 설명하는 글인지 읽어 보세요.`:'')
      + (it.length&&!it.some(expSafe)?' 기본으로 켜진 것이 없습니다. 내용을 보고 직접 골라 주세요.':'');
  };

  function expToggle(focus){
    const isNew=$('#expCat').value==='__new';
    $('#expNewWrap').hidden=!isNew; $('#expSubWrap').hidden=!isNew;
    if(isNew&&focus) $('#expNew').focus();
  }
  $('#expCat').addEventListener('change',()=>expToggle(true));
  expToggle(false);      // 분야가 하나도 없으면 처음부터 "새 분야" 칸이 열려 있어야 한다

  // 아직 돌고 있는 요청이 있으면 그 결과를 이 창에 이어 붙인다
  if(expPending) expAttach(expPending);
  // 지난번에 받아 둔 제안이 남아 있으면 이어서 볼 수 있게 한다 (한 번 받는 데 15회분이 든다)
  else if(expCache&&expCache.items.length&&Date.now()-expCache.at<1800000){
    $('#expMsg').innerHTML=`조금 전 받은 제안 ${expCache.items.length}개가 남아 있습니다. `
      +`<button type="button" class="btn small" id="expResume">이어서 보기</button> `
      +`<button type="button" class="btn small ghost" id="expDrop">버리기</button>`;
    $('#expResume').addEventListener('click',()=>{
      if(!expCache||!expCache.items.length){ $('#expMsg').textContent='남아 있던 제안이 사라졌습니다. 다시 받아 주세요.'; return; }
      exp={cat:expCache.cat,catId:expCache.catId||'',isNew:expCache.isNew,items:expCache.items};
      if(exp.catId&&[...$('#expCat').options].some(o=>o.value===exp.catId)) $('#expCat').value=exp.catId;
      $('#expMsg').textContent=`제안 ${exp.items.length}개를 이어서 봅니다.`; renderExp();
    });
    $('#expDrop').addEventListener('click',()=>{ expCache=null; $('#expMsg').textContent=''; });
  }else expCache=null;      // 30분이 지나면 링크 점검 결과가 낡았으므로 버린다

  // 돌고 있는 요청에 화면을 붙인다. 창을 닫았다 다시 열어도 같은 함수로 이어 붙는다.
  function expAttach(pend){
    const msg=$('#expMsg'), btn=$('#expBtn');
    btn.disabled=true;
    msg.textContent=`AI 가 "${pend.cat}" 에 넣을 자료를 찾는 중… (30초에서 1분쯤 걸립니다)`;
    if(pend.catId&&[...$('#expCat').options].some(o=>o.value===pend.catId)) $('#expCat').value=pend.catId, expToggle(false);
    pend.p.then(res=>{
      if(expPending===pend) expPending=null;
      if(!alive()) return;
      btn.disabled=false;
      // 그 사이 계정이 바뀌었거나 다른 요청이 시작됐으면 이 결과는 버린다
      if(res.gen!==expGen){ msg.textContent='그 사이 다른 일이 있어 이 결과는 쓰지 않았습니다.'; return; }
      if(res.err){ msg.textContent='실패: '+(res.err.message||res.err.code||'오류'); return; }
      if(!res.items.length){ msg.textContent='제안을 받지 못했습니다. 주제 힌트를 조금 더 구체적으로 적고 다시 시도해 주세요. (이번 시도에도 사용량 15회분은 차감됩니다)'; return; }
      exp={cat:res.cat,catId:res.catId||'',isNew:res.isNew,items:res.items};
      msg.textContent=expSummary(res.r);
      renderExp();
    });
  }

  $('#expBtn').addEventListener('click',()=>{
    const msg=$('#expMsg'), out=$('#expOut');
    // 이름은 먼저 본다. ensureName() 은 부를 수 없다 — 이름 창이 이 창을 갈아치워 제안이 사라진다.
    if(!ME.name){ msg.textContent=NEEDNAME; return; }
    if(expPending){ expAttach(expPending); return; }
    const raw=$('#expCat').value, pickNew=raw==='__new';
    let catId=pickNew?'':raw, cat=pickNew?'':catName(raw), subs=null;
    if(pickNew){
      cat=$('#expNew').value.trim();
      if(!cat){ msg.textContent='새 분야 이름을 적어 주세요.'; $('#expNew').focus(); return; }
      // 분야 이름의 쉼표·콜론 금지는 텍스트 편집기 시절의 제약이었다. 행 편집기에는 구분자가 없다.
      // 창을 열 때의 스냅샷만 보면 방금 만든 분야를 못 잡는다. 지금 목록도 함께 본다.
      const same=expCats.find(c=>c.name===cat)||S.cats.find(c=>c.name===cat);
      if(same){
        msg.textContent='이미 있는 분야입니다. 위 목록에서 골라 주세요.';
        const csel=$('#expCat');
        if(![...csel.options].some(o=>o.value===same.id)) csel.add(new Option(`${same.name} (0개)`,same.id),csel.options.length-1);
        csel.value=same.id; expToggle(false); return;
      }
      subs=$('#expSubs').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).slice(0,12).map(s=>s.slice(0,60));
    }
    out.innerHTML=''; exp=null; expCache=null;
    const gen=++expGen;
    // 결과를 받아 캐시에 넣는 일은 창과 상관없이 이 약속(Promise) 안에서 끝낸다
    const req=store.ai('expand',{...(pickNew?{newCategoryName:cat,category:cat,subs}:{categoryId:catId,category:cat}),
      topic:$('#expTopic').value.trim(), count:+$('#expCount').value, mix:$('#expMix').value})
      .then(r=>{
        // isNew 면 서버가 categoryId 를 일부러 비운 것이다. 내가 들고 있던 옛 id 로 도로 채우면
        // (지워진 분야를 가리키는 낡은 탭) 분야를 만들지 않고 자료만 들어가 전부 "분야 없음" 이 된다.
        const items=(r.items||[]).map(x=>({...x})), got={r,items,gen,cat:r.category||cat,catId:r.isNew?'':(r.categoryId||catId),isNew:!!r.isNew};
        if(gen===expGen&&items.length) expCache={cat:got.cat,catId:got.catId,isNew:got.isNew,items,at:Date.now()};
        return got;
      },e=>({err:e,items:[],cat,catId,gen}));
    expPending={cat,catId,p:req,gen};
    expAttach(expPending);
  });

  function renderExp(){
    const out=$('#expOut');
    if(!exp||!exp.items.length){ out.innerHTML=''; return; }
    const known=new Set((catOf(exp.catId)||{subs:[]}).subs);
    S.items.forEach(i=>{ if(exp.catId&&i.categoryId===exp.catId&&i.sub) known.add(i.sub); });
    out.innerHTML=`<div class="ai-row">
        <label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="expAll" aria-label="전체 선택"> 전체 선택</label>
        <button type="button" class="btn ghost small" id="expSafeBtn">안전한 것만</button>
        <span class="hint" id="expSel"></span></div>
      <div class="ai-wrap" id="expList">${exp.items.map((p,i)=>{
        const no=expBad(p), su=p.type==='link'?safeUrl(p.url):'', warn=expWarn(p);
        return `<div class="ai-card${no?' blocked':''}">
          <label class="ai-card-h">
            <input type="checkbox" data-xi="${i}" ${no?'disabled':((p.pick===undefined?expSafe(p):p.pick)?'checked':'')} aria-label="추가 대상으로 선택: ${esc(p.title||'')}">
            <span class="kind ${esc(p.type)}">${esc((TYPES[p.type]||{k:'?'}).k)}</span>
            <b>${esc(p.title||'(제목 없음)')}</b>${lkBadge(p.link)}${DUPB[p.dup]?`<span class="chip warn">${DUPB[p.dup]}</span>`:''}${p.risk==='block'?'<span class="chip warn">위험한 명령</span>':p.risk==='warn'?'<span class="chip warn">명령 언급</span>':''}${p.err?'<span class="chip warn">저장 실패</span>':''}
          </label>
          <div class="ai-card-m">
            <span class="chip cat">${esc(exp.cat)}${p.sub?' › '+esc(p.sub):''}</span>${(p.sub&&!known.has(p.sub))?'<span class="ai-tag">새 하위분야</span>':''}
            ${(p.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}
            ${su?`<a class="chip" href="${esc(su)}" target="_blank" rel="noopener">${esc(host(p.url)||p.url)} ↗</a>`:''}
          </div>
          ${p.reason?`<div class="hint">✦ ${esc(p.reason)}</div>`:''}
          ${p.body?`<div class="ai-prev${p.type==='snippet'?' code':''}">${esc(p.body)}</div>`:''}
          ${no?`<div class="hint ai-bad">${esc(expBadWhy(p))}</div>`:warn.map(w=>`<div class="hint">${esc(w)}</div>`).join('')}
          ${p.err?`<div class="hint ai-bad">저장하지 못했습니다 (${esc(p.err)}). 다시 시도할 수 있습니다.</div>`:''}
        </div>`; }).join('')}</div>
      <div class="ai-row"><label class="hint" style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="expTag" checked> 추가할 때 <b>#ai제안</b> 태그 붙이기</label></div>
      <div class="ai-row"><button type="button" class="btn primary small" id="expAdd">선택한 자료 추가</button>
        <span class="hint" id="expAddMsg" aria-live="polite"></span></div>`;
    const list=$('#expList'), all=$('#expAll'), num=$('#expSel');
    const boxes=()=>[...list.querySelectorAll('[data-xi]')];
    const sync=()=>{ const b=boxes(), free=b.filter(x=>!x.disabled), on=b.filter(x=>x.checked).length;
      b.forEach(x=>{ const p=exp.items[+x.dataset.xi]; if(p&&!x.disabled) p.pick=x.checked; });
      num.textContent=`${exp.items.length}개 중 ${on}개 선택`+(b.length-free.length?` (${b.length-free.length}개는 고를 수 없음)`:'');
      all.checked=on>0&&on===free.length; all.indeterminate=on>0&&!all.checked; };
    all.addEventListener('change',e=>{ boxes().forEach(x=>{ if(!x.disabled) x.checked=e.target.checked; }); sync(); });
    $('#expSafeBtn').addEventListener('click',()=>{ boxes().forEach(x=>{ if(!x.disabled) x.checked=expSafe(exp.items[+x.dataset.xi]); }); sync(); });
    list.addEventListener('change',sync);
    sync();
    $('#expAdd').addEventListener('click',expAdd);
  }

  async function expAdd(){
    // 아래에 분야 만들기(await)가 끼어 있다. 그 사이 창이 닫히면 $('#...') 가 null 이 되므로
    // 쓰기 전에 한 번 잡아 두고 전부 있는지 보고 쓴다. 예전에는 await 이 없어 이 구멍이 없었다.
    const out=$('#expOut'), m=$('#expAddMsg'), addBtn=$('#expAdd'), goBtn=$('#expBtn'), tagBox=$('#expTag');
    if(!exp||!exp.items.length){ m.textContent='추가할 제안이 없습니다.'; return; }
    // 지금 켜고 끈 상태를 항목에 적어 둔다. 다시 그릴 때 운영자가 끈 것이 되살아나지 않도록.
    out.querySelectorAll('[data-xi]').forEach(c=>{ const p=exp.items[+c.dataset.xi]; if(p&&!c.disabled) p.pick=c.checked; });
    const sel=[...out.querySelectorAll('[data-xi]:checked')].map(c=>exp.items[+c.dataset.xi]).filter(p=>!expBad(p));
    if(!sel.length){ m.textContent='선택한 자료가 없습니다.'; return; }
    if(!ME.name){ m.textContent=NEEDNAME; return; }
    // 새 분야는 자료보다 **먼저** 만든다. 순서가 반대면 그 자료들이 분야를 못 이어 고아가 된다 —
    // 담당자가 고칠 수도 점검할 수도 없고, 다음 제안에서 중복으로 걸러지지도 않는다.
    // 자료가 하나도 안 들어가 빈 분야만 남으면 "분야 편집" 에서 지우면 된다 (자료가 없으면 지워진다).
    let catId=exp.catId||((S.cats.find(c=>c.name===exp.cat)||{}).id||''), madeCat=false;
    if(!catId){
      if(addBtn) addBtn.disabled=true;
      if(alive()) m.textContent=`분야 "${exp.cat}" 를 만드는 중…`;
      try{
        const saved=await store.saveCategories([...S.cats.map(c=>({...c,subs:c.subs.slice()})),{id:'',name:exp.cat,subs:[]}]);
        catId=((saved||[]).find(c=>c.name===exp.cat)||{}).id||''; madeCat=true; exp.catId=catId;
        // 방금 만든 분야를 이 창의 목록에도 넣는다. 안 넣으면 같은 이름으로 "새 분야" 요청이 또 나가고,
        // 서버는 자료가 없는 분야로 알고 방금 넣은 것을 그대로 다시 제안한다 (사용량 15회분).
        if(catId&&!expCats.some(c=>c.id===catId)){
          expCats.push({id:catId,name:exp.cat});
          const csel=$('#expCat');
          if(csel) csel.add(new Option(`${exp.cat} (0개)`,catId),csel.options.length-1);
        }
      }catch(x){
        if(addBtn) addBtn.disabled=false;
        if(alive()) m.textContent='분야를 만들지 못했습니다 ('+(x.message||x.code||'오류')+'). 다시 눌러 주세요.';
        return;
      }
    }
    // 저장하는 동안에는 "제안 받기" 도 막는다. 도중에 새 요청이 들어오면 exp 가 갈려 루프가 죽는다.
    if(addBtn) addBtn.disabled=true; if(goBtn) goBtn.disabled=true;
    out.querySelectorAll('input[type=checkbox]').forEach(c=>c.disabled=true);
    // 저장하는 동안에는 캐시를 비운다. 이때 창을 닫고 다시 열어 "이어서 보기" 를 누르면
    // 방금 들어간 자료를 한 벌 더 넣게 된다. 남은 것은 끝에서 다시 담는다.
    const keepAt=(expCache&&expCache.at)||Date.now(), gen=++expGen;
    expCache=null;
    const extra=(tagBox&&tagBox.checked)?['ai제안']:[];
    const now=new Date().toISOString(), done=[];
    let ok=0, bad=0;
    for(const p of sel){
      const item={
        id:uid(), type:p.type, title:p.title,
        url:p.type==='link'?safeUrl(p.url):'',
        lang:p.type==='snippet'?(p.lang||''):'',
        body:(p.body||'').replace(/\s+$/,''),
        category:exp.cat, categoryId:catId, sub:(p.sub||'').trim(),
        tags:[...new Set([...(p.tags||[]).map(t=>String(t).replace(/^#/,'').trim()).filter(Boolean),...extra])].slice(0,20),
        votes:0, by:ME.name, ownerId:ME.id, createdAt:now,
      };
      try{ await store.put(item); ok++; p.err=null; done.push(item); }
      catch(x){ bad++; p.err=x.message||x.code||'오류'; }
      if(alive()) m.textContent=`추가 중… ${ok+bad}/${sel.length}`;
    }
    // 하위분야는 성공한 것만 모아 마지막에 한 번 반영한다 (목록 전체를 덮어쓰는 호출이라서)
    let catMsg=madeCat?`, 새 분야 "${exp.cat}" 를 만들었습니다`:'';
    if(ok&&catId){
      const merged=S.cats.map(c=>({...c,subs:c.subs.slice()}));
      const t=merged.find(c=>c.id===catId); let newSub=0;
      if(t){
        done.forEach(it=>{ if(it.sub&&!t.subs.includes(it.sub)){ t.subs.push(it.sub); newSub++; } });
        if(newSub){
          try{ await store.saveCategories(merged); catMsg+=`, 하위분야 ${newSub}개 추가`; }
          catch(x){ catMsg+=', 하위분야는 목록에 반영하지 못했습니다'; }
        }
      }
    }
    if(ok) toast(`자료 ${ok}개를 추가했습니다`);
    exp.items=exp.items.filter(p=>!(sel.includes(p)&&!p.err));   // 들어간 것만 목록에서 뺀다
    // 저장이 도는 사이 다른 요청이 캐시를 차지했으면 건드리지 않는다. 시각도 처음 받은 때 그대로 둔다.
    if(gen===expGen) expCache=exp.items.length?{...exp,at:keepAt}:null;
    if(goBtn) goBtn.disabled=false;
    if(!alive()) return;
    const line=`완료: ${ok}개 추가${bad?`, ${bad}개 실패`:''}${catMsg}`;
    if(!exp.items.length){
      $('#expOut').innerHTML='';
      $('#expMsg').innerHTML=esc(line)+' <button type="button" class="btn small" id="expGo">이 분야 보기</button>';
      const go=catId;
      $('#expGo').addEventListener('click',()=>{
        Object.assign(S,{q:'',type:'all',catId:go||'all',sub:null,tag:null,col:null,mine:false,sel:null,cursor:-1,view:'list'});
        $('#q').value='';
        if(go&&!S.openCatIds.includes(go)){ S.openCatIds=[...S.openCatIds,go]; LS.set('toolbox.openCatIds',S.openCatIds); }
        expCache=null; closeModal(); render();
      });
    }else{ renderExp(); $('#expAddMsg').textContent=line+(bad?'. 실패한 것은 다시 누를 수 있습니다.':'. 남은 것은 그대로 두거나 다시 골라 추가하세요.'); }
  }
}

/* 지금 서버가 내려 주는 index.html 의 내용 지문. Vercel 의 ETag 가 파일 MD5 라 그대로 쓴다.
   손으로 올리는 버전 번호는 올리는 것을 잊거나 푸시를 빠뜨리면 거짓말을 하는데, 이 값은 그럴 수가 없다.
   로컬에서 `md5sum index.html` 한 앞 7자리와 견주면 배포가 되었는지 바로 안다. */
async function showVersion(){
  const el=$('#verLine'); if(!el) return;
  try{
    const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
    const tag=(r.headers.get('etag')||'').replace(/^W\//,'').replace(/"/g,'').slice(0,7);
    if(tag&&document.body.contains(el)) el.textContent=' · 배포본 '+tag;
  }catch(e){ /* 파일로 직접 열었거나 헤더가 없으면 표시하지 않는다 */ }
}

function openIO(){
  modal(`${mh('파일로 관리')}<div class="modal-b">
      <p style="margin:0;color:var(--muted)">전체 항목과 모음을 JSON 파일로 내보내거나, 파일을 골라 한 번에 넣을 수 있습니다. 같은 id 는 덮어쓰고 새 id 는 추가됩니다.</p>
      <div class="two">
        <button class="btn" id="exportBtn">⇩ JSON 내보내기</button>
        <label class="btn" style="justify-content:center">⇧ JSON 가져오기<input type="file" accept="application/json,.json" id="importFile" hidden></label>
      </div>
      <div class="hint">새 항목은 내 글로 등록되고, 이미 있는 항목은 올린 사람이 그대로 유지됩니다. 가져오기는 로그인이 필요합니다.</div>
      <div class="hint" id="ioMsg"></div>
  </div>`);
  $('#exportBtn').addEventListener('click',()=>{
    // v:2 는 "분야 id 가 들어 있다" 는 표시다. 옛 백업(v 없음)은 이름으로만 이어 붙일 수 있다.
    const data=JSON.stringify({v:2,exportedAt:new Date().toISOString(),categories:S.cats,items:S.items.filter(x=>!x.example),collections:S.cols},null,2);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='toolbox-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('내보냈습니다');
  });
  $('#importFile').addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f)return; const msg=$('#ioMsg');
    if(!await ensureName()) return;
    try{
      const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:(j.items||[]);
      if(!arr.length) throw new Error('항목이 없습니다');
      let ok=0,fail=0,noCat=0,catErr='',why='';
      // 분야를 자료보다 **먼저** 넣는다. 순서가 반대면 파일에만 있던 분야의 자료가 분야를 못 이어 고아가 된다.
      // 실패해도 자료 가져오기는 이어 간다. 이 오류를 큰 try 에 맡기면 "읽을 수 없는 파일" 로 나와 파일을 의심하게 된다.
      if(S.admin&&Array.isArray(j.categories)&&j.categories.length){
        const merged=S.cats.map(c=>({...c,subs:c.subs.slice()})), add=[];
        normCats(j.categories).forEach(c=>{
          const ex=merged.find(x=>(c.id&&x.id===c.id)||x.name===c.name);   // id 우선, 없으면 이름 (옛 백업)
          if(ex) ex.subs=[...new Set([...ex.subs,...c.subs])]; else add.push({id:c.id||'',name:c.name,subs:c.subs});
        });
        // 파일에만 있는 분야는 말없이 만들지 않는다. id 없는 옛 백업 + 그 사이 개명이면
        // 옛 이름으로 분야가 하나 더 생기고, 아래 자료 루프가 기존 자료를 통째로 그 빈 분야로 옮긴다
        // (담당자 지정은 원래 분야에 남아, 담당자가 자기 자료를 못 고치게 된다).
        const mk=add.length? confirm(`파일에만 있는 분야 ${add.length}개(${add.slice(0,5).map(c=>c.name).join(', ')}${add.length>5?' 외':''})를 새로 만들까요?\n\n이름이 바뀐 분야라면 같은 분야가 둘로 갈라집니다.\n[취소] 를 누르면 만들지 않고, 그 이름을 쓰는 자료는 지금 연결을 그대로 둡니다.`) : false;
        if(mk) add.forEach(c=>merged.push(c));
        else if(add.length) catErr=` · 파일에만 있는 분야 ${add.length}개는 만들지 않았습니다`;
        try{ await store.saveCategories(merged); }
        // 여기서 바로 msg 에 쓰면 아래 "가져오는 중…" 이 첫 자료에서 덮어 버린다. 끝까지 들고 간다.
        catch(x){ catErr=' · 분야 목록은 반영하지 못했습니다 ('+(x.message||x.code||'오류')+')'; }
      }
      for(const raw of arr){
        const rid=okId(raw.id)?String(raw.id):uid();                 // 이상한 id 는 새로 만든다 (화면 속성에 그대로 들어가므로)
        const ex=S.items.find(x=>x.id===rid);
        // 분야는 id 를 먼저 믿고, 없거나 목록에 없으면 이름으로 잇는다.
        // 둘 다 안 되면 **이미 있던 자료의 연결을 그대로 둔다**. 여기서 빈 값을 넘기면 category_id 가
        // null 로 덮여, 멀쩡히 이어져 있던 자료가 오류 하나 없이 "분야 없음" 으로 떨어지고
        // 그 분야 담당자는 권한까지 잃는다 (트리거는 명시적으로 보낸 null 을 구제해 주지 않는다).
        const cid=((raw.categoryId&&catOf(String(raw.categoryId)))?String(raw.categoryId):'')
          ||(raw.category?((S.cats.find(c=>c.name===String(raw.category))||{}).id||''):'')
          ||(ex?ex.categoryId:'')||'';
        // 실제로 분야를 잃은 것만 센다. 기존 연결을 지킨 자료는 "분야 없음" 에 모이지 않는다.
        if(!cid&&(raw.category||raw.categoryId)) noCat++;
        // 이름 사본도 id 에서 끌어낸다. 파일에 남아 있던 낡은 이름을 그대로 실으면 어긋난 채로 굳는다.
        const cname=cid?(catName(cid)||String(raw.category||'')):(String(raw.category||'')||(ex?ex.category:'')||'');
        const it={id:rid,type:TYPES[raw.type]?raw.type:'link',title:String(raw.title||raw.url||'(제목 없음)'),url:String(raw.url||''),lang:String(raw.lang||''),body:String(raw.body||''),category:cname,categoryId:cid,sub:String(raw.sub||''),tags:Array.isArray(raw.tags)?raw.tags.map(String):[],
          // 이미 있는 항목은 올린 사람·소유자·수정시각을 그대로 둔다 (백업 복원 시 소유권이 넘어가지 않게)
          by:ex?ex.by:String(raw.by||ME.name),ownerId:ex?ex.ownerId:ME.id,createdAt:ex?ex.createdAt:(raw.createdAt||new Date().toISOString()),updatedAt:ex?ex.updatedAt:(raw.updatedAt||null)};
        if(ex&&!canEdit(ex)){ fail++; continue; }
        // 서버가 왜 거절했는지 한 줄이라도 보여 준다. 개수만 보이면 새로 고치면 될 일인지 알 수 없다
        // (예: "분야 목록이 그 사이에 바뀌었습니다. 화면을 새로 고친 뒤 다시 저장해 주세요").
        try{ await store.put(it); ok++; }catch(x){ fail++; if(!why) why=x.message||x.code||''; }
        msg.textContent=`가져오는 중… ${ok+fail}/${arr.length}`;
      }
      if(Array.isArray(j.collections)) for(const c of j.collections){ if(!(c&&okId(c.id)&&c.title)) continue;
        const ex=S.cols.find(x=>x.id===c.id); if(ex&&!canEdit(ex)) continue;
        await store.putCol({id:String(c.id),title:String(c.title),desc:String(c.desc||''),itemIds:(Array.isArray(c.itemIds)?c.itemIds:[]).filter(okId),
          by:ex?ex.by:String(c.by||ME.name),ownerId:ex?ex.ownerId:ME.id,createdAt:ex?ex.createdAt:(c.createdAt||new Date().toISOString())}); }
      msg.textContent=`완료: ${ok}개 추가·갱신${fail?`, ${fail}개 건너뜀(권한 없음 또는 실패)`:''}`
        +(noCat?` · 분야를 찾지 못한 자료 ${noCat}건은 "분야 없음" 에 모입니다`:'')+catErr+(why?` · ${why}`:''); toast(`${ok}개를 가져왔습니다`);
    }catch(x){ msg.textContent='읽을 수 없는 파일입니다: '+(x.message||x); }
    e.target.value='';
  });
}

  store.onAuth(me=>{
    // 계정이 바뀌면 앞 사람이 받아 둔 AI 제안을 넘기지 않는다 (제안에는 그 사람이 준 주제 힌트가 섞여 있다).
    // 화면에 남은 목록과 버튼까지 지운다. 캐시만 비우면 "이어서 보기" 가 눌리는 죽은 버튼으로 남는다.
    if(ME.id&&ME.id!==me.id){
      expCache=null; expPending=null; expGen++;
      const em=$('#expMsg'), eo=$('#expOut');
      if(em) em.textContent='계정이 바뀌어 이전 제안을 지웠습니다.';
      if(eo) eo.innerHTML='';
    }
    Object.assign(ME,{id:me.id,name:me.name,email:me.email,provider:me.provider||'',suggestedName:me.suggestedName||''});
    S.admin=!!me.admin; render();
  });
  // 키를 갈았다. 옛 'toolbox.openCats' 에는 분야 이름이 들어 있어 id 와 영영 안 맞는다.
  S.openCatIds=(LS.get('toolbox.openCatIds',[])||[]).filter(x=>typeof x==='string');
  store.subscribe(d=>{ Object.assign(S,{items:d.items,cats:d.cats,cols:d.cols,reports:d.reports,myVotes:d.myVotes||[]}); render(); });
  // 메일 링크가 만료·사용됨 상태로 돌아온 경우: 주소의 오류를 읽어 안내하고 코드 입력으로 유도
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(ready&&h.get('error')){
    const code=h.get('error_code')||'', desc=h.get('error_description')||'';
    history.replaceState(null,'',location.pathname+location.search);
    const why=code==='otp_expired'?'로그인 링크가 만료되었거나 이미 사용되었습니다. 메일 보안 프로그램이 링크를 먼저 열어 보는 경우 이렇게 됩니다. 링크 대신 메일 속 6자리 코드를 입력해 주세요.':'로그인하지 못했습니다: '+desc.replace(/\+/g,' ');
    openLogin(why);
    if(code==='otp_expired') $('#lfHave').click();
  }
})();
</script>
</body>
</html>
