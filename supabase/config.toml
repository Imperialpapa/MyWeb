# Supabase CLI 설정 (Edge Function 배포용)
# 대시보드에서 만든 프로젝트와 연결: npx supabase link --project-ref <프로젝트 ref>
project_id = "toolbox"

[functions.ai]
# 반드시 false 로 둔다. 문서를 보고 true 로 "고치지" 마라.
# - 로그인 확인은 함수가 요청마다 직접 한다 (index.ts: Bearer 토큰 거르기 → getUser). 꺼도 뚫리는 곳이 없다.
# - 플랫폼의 JWT 검사가 새 publishable 키·새 JWT 서명 키를 어떻게 다루는지 공식 문서끼리 말이 다르다.
#   같은 문서 안에서도 "받아 준다" 와 "Invalid JWT 로 거절한다" 가 둘 다 있고, 서명 키를 바꾸면 "깨질 수 있다" 고도 한다.
# - functions/auth.mdx 는 supabase-js 로 부르는 함수는 true 로 두라고 권한다. 따라 켜면 키 교체·서명 키 교체 때
#   요청이 함수 코드에 닿기 전에 401 로 막혀, 함수가 남기는 로그 하나 없이 AI 가 멈출 수 있다.
# - 대가: 로그인 안 한 요청도 함수까지 와서 호출 횟수로 잡힌다. 그래서 함수는 네트워크를 쓰기 전에 먼저 거른다.
# - 대시보드 토글이나 다른 도구로 배포하면 다시 켜질 수 있다. 배포 뒤 Edge Functions → ai 에서 꺼져 있는지 볼 것.
verify_jwt = false

[functions.media]
# ai 와 같은 이유로 false. 함수가 요청마다 로그인을 직접 확인한다 (media/index.ts)
verify_jwt = false
